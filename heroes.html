<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>גיבורי על - משחק חשבון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Russo+One&display=swap" rel="stylesheet">
<style>
/* ===== RESET & BASE ===== */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',Tahoma,sans-serif;
  background:#0a0a2e;color:#fff;touch-action:manipulation;user-select:none;-webkit-user-select:none}

/* ===== ANIMATED SPACE + HALFTONE BACKGROUND ===== */
body::before{content:'';position:fixed;top:0;left:0;width:200%;height:200%;
  background:radial-gradient(2px 2px at 20px 30px,#fff,transparent),
  radial-gradient(2px 2px at 40px 70px,rgba(255,255,200,0.8),transparent),
  radial-gradient(3px 3px at 90px 40px,#fff,transparent),
  radial-gradient(2px 2px at 130px 80px,rgba(200,200,255,0.9),transparent),
  radial-gradient(2px 2px at 160px 30px,#fff,transparent),
  radial-gradient(3px 3px at 50px 160px,rgba(255,200,200,0.8),transparent),
  radial-gradient(2px 2px at 100px 120px,#fff,transparent),
  radial-gradient(2px 2px at 180px 150px,rgba(200,255,200,0.7),transparent);
  background-size:200px 200px;animation:starsMove 120s linear infinite;z-index:0;pointer-events:none}
@keyframes starsMove{0%{transform:translate(0,0)}100%{transform:translate(-200px,-200px)}}

/* Comic halftone overlay */
body::after{content:'';position:fixed;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(circle,rgba(255,255,255,0.03) 1px,transparent 1px);
  background-size:8px 8px;z-index:0;pointer-events:none}

/* ===== FULLSCREEN BUTTON ===== */
.fullscreen-btn{position:fixed;top:10px;left:10px;z-index:500;width:44px;height:44px;
  border-radius:12px;border:3px solid #000;background:linear-gradient(135deg,#FFD700,#FFA000);
  font-size:1.3rem;cursor:pointer;touch-action:manipulation;color:#000;font-weight:900;
  box-shadow:3px 3px 0 #000;transition:transform 0.15s;display:flex;align-items:center;justify-content:center}
.fullscreen-btn:active{transform:scale(0.9);box-shadow:1px 1px 0 #000}

/* ===== SCREENS ===== */
.screen{position:fixed;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;
  align-items:center;z-index:1;overflow-y:auto;overflow-x:hidden}
.screen.active{display:flex}

/* ===== CANVAS PARTICLES ===== */
#particles-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:100;pointer-events:none}

/* ===== ACTION WORD OVERLAY ===== */
#action-word{position:fixed;z-index:200;pointer-events:none;display:none;
  animation:actionPop 0.8s ease forwards}
#action-word.text-mode{font-family:'Bangers',cursive;font-size:6rem;color:#FFD700;
  -webkit-text-stroke:3px #000;paint-order:stroke fill;
  background:linear-gradient(135deg,#FF6347,#FFD700);-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(4px 4px 0 rgba(0,0,0,0.7));letter-spacing:2px}
#action-word img{width:220px;height:auto;max-height:180px;object-fit:contain;
  filter:drop-shadow(4px 4px 0 rgba(0,0,0,0.5))}
@keyframes actionPop{0%{transform:rotate(-15deg) scale(0);opacity:0}
  30%{transform:rotate(-10deg) scale(1.4);opacity:1}
  60%{transform:rotate(-12deg) scale(1.1);opacity:1}
  100%{transform:rotate(-12deg) scale(1.3);opacity:0}}

/* ===== COUNTDOWN OVERLAY ===== */
#countdown-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:300;
  display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.8);backdrop-filter:blur(8px)}
#countdown-number{font-family:'Bangers',cursive;font-size:14rem;font-weight:900;color:#FFD700;
  -webkit-text-stroke:4px #000;paint-order:stroke fill;
  text-shadow:0 0 40px rgba(255,215,0,0.8),0 0 80px rgba(255,100,0,0.4);
  animation:countZoom 0.7s ease}
@keyframes countZoom{0%{transform:scale(3);opacity:0}50%{transform:scale(0.9);opacity:1}100%{transform:scale(1);opacity:1}}

/* ===== SCREEN FLASH ===== */
#screen-flash{position:fixed;top:0;left:0;width:100%;height:100%;z-index:150;
  pointer-events:none;opacity:0;transition:opacity 0.1s}

/* ===== STREAK BANNER ===== */
.streak-banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:250;
  display:none;font-family:'Bangers',cursive;font-size:3rem;color:#FFD700;text-align:center;
  -webkit-text-stroke:2px #000;paint-order:stroke fill;
  text-shadow:0 0 20px rgba(255,215,0,0.8);
  animation:streakPop 1.2s ease forwards;white-space:nowrap}
@keyframes streakPop{0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg);opacity:0}
  30%{transform:translate(-50%,-50%) scale(1.3) rotate(5deg);opacity:1}
  60%{transform:translate(-50%,-50%) scale(1.1) rotate(-2deg);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1.2) rotate(0deg);opacity:0}}

/* ===== COMIC RAY BURST ===== */
.ray-burst{position:absolute;top:50%;left:50%;width:400px;height:400px;transform:translate(-50%,-50%);
  background:conic-gradient(from 0deg,transparent 0deg,rgba(255,215,0,0.06) 10deg,transparent 20deg,
  rgba(226,54,54,0.04) 30deg,transparent 40deg,rgba(255,215,0,0.06) 50deg,transparent 60deg);
  border-radius:50%;animation:rayRotate 20s linear infinite;pointer-events:none;z-index:0}
@keyframes rayRotate{0%{transform:translate(-50%,-50%) rotate(0deg)}100%{transform:translate(-50%,-50%) rotate(360deg)}}

/* ===== MENU SCREEN ===== */
#menu-screen{padding:10px 16px;gap:10px;position:relative}

.menu-title{font-family:'Bangers',cursive;font-size:3.5rem;text-align:center;margin-top:12px;
  color:#FFD700;-webkit-text-stroke:3px #000;paint-order:stroke fill;
  text-shadow:4px 4px 0 #C62828,6px 6px 0 rgba(0,0,0,0.3);
  letter-spacing:3px;animation:titlePulse 3s ease-in-out infinite;position:relative;z-index:1}
@keyframes titlePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

.menu-subtitle{font-family:'Bangers',cursive;font-size:1.4rem;color:#fff;text-align:center;
  -webkit-text-stroke:1px rgba(0,0,0,0.5);letter-spacing:4px;
  text-shadow:2px 2px 0 rgba(0,0,0,0.5);margin:0 0 6px;position:relative;z-index:1}

/* Star Counter - Comic Badge */
.star-counter{font-family:'Bangers',cursive;font-size:1.6rem;color:#FFD700;
  display:flex;align-items:center;gap:6px;padding:8px 20px;
  background:linear-gradient(135deg,#1a1a4e,#0D47A1);border:3px solid #000;border-radius:30px;
  box-shadow:3px 3px 0 #000;letter-spacing:1px;position:relative;z-index:1}


/* Mode Buttons - Comic Style */
.mode-buttons{display:flex;flex-direction:column;gap:12px;width:100%;max-width:380px;padding:0 16px;
  position:relative;z-index:1}
.mode-btn{display:flex;align-items:center;gap:14px;padding:16px 20px;border:4px solid #000;border-radius:14px;
  cursor:pointer;touch-action:manipulation;font-size:1.3rem;font-weight:800;color:#fff;
  position:relative;overflow:hidden;transition:transform 0.15s,box-shadow 0.15s;
  box-shadow:5px 5px 0 #000;transform:skewX(-2deg);font-family:'Bangers',cursive;letter-spacing:1px}
.mode-btn:active{transform:skewX(-2deg) scale(0.96);box-shadow:2px 2px 0 #000}
.mode-btn-icon{font-size:2.2rem;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4))}
.mode-btn-text{display:flex;flex-direction:column;text-align:right}
.mode-btn-title{font-size:1.4rem}
.mode-btn-desc{font-size:0.8rem;font-weight:400;opacity:0.8;font-family:'Segoe UI',sans-serif;
  -webkit-text-stroke:0;letter-spacing:0}
.mode-btn-counting{background:linear-gradient(135deg,#9C27B0,#4A148C)}
.mode-btn-mission{background:linear-gradient(135deg,#E23636,#B71C1C)}
.mode-btn-battle{background:linear-gradient(135deg,#FF6F00,#E65100)}
.mode-btn::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);
  transition:left 0.5s}
.mode-btn:hover::after{left:120%}

/* Hero Collection */
.collection-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:6px 12px;
  max-width:520px;position:relative;z-index:1}
.collection-badge{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:3px solid #000;box-shadow:2px 2px 0 rgba(0,0,0,0.5);transition:transform 0.2s;position:relative}
.collection-badge.unlocked{animation:badgePulse 3s ease-in-out infinite}
.collection-badge.locked{filter:grayscale(0.8);opacity:0.45}
.collection-badge.locked::after{content:'🔒';position:absolute;font-size:0.7rem;
  bottom:-2px;right:-2px;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.8))}
.collection-badge img{width:32px;height:32px;border-radius:50%;object-fit:cover}
@keyframes badgePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* ===== GAME SCREEN ===== */
.game-screen{padding:8px 12px;gap:6px;position:relative}
.game-screen::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(circle,rgba(255,255,255,0.04) 1px,transparent 1px);
  background-size:6px 6px;pointer-events:none;z-index:0}

.game-header{width:100%;display:flex;justify-content:space-between;align-items:center;padding:0 4px;
  position:relative;z-index:2}
.back-btn{width:48px;height:48px;border-radius:12px;border:3px solid #000;
  background:linear-gradient(135deg,#FFD700,#FFA000);font-size:1.5rem;cursor:pointer;
  touch-action:manipulation;color:#000;display:flex;align-items:center;justify-content:center;
  box-shadow:3px 3px 0 #000;transition:transform 0.15s;font-weight:900}
.back-btn:active{transform:scale(0.9);box-shadow:1px 1px 0 #000}
.progress-text{font-family:'Bangers',cursive;font-size:1.3rem;color:#fff;
  -webkit-text-stroke:1px rgba(0,0,0,0.5);letter-spacing:2px;
  text-shadow:2px 2px 0 rgba(0,0,0,0.4);position:relative;z-index:2}

/* Power Meter */
.power-meter{display:flex;gap:8px;justify-content:center;padding:6px 0;position:relative;z-index:2}
.power-orb{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,0.3);
  background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;
  font-size:1rem;color:rgba(255,255,255,0.4);transition:all 0.4s ease}
.power-orb.filled{border-color:#000;transform:scale(1.15);
  animation:orbFillBig 0.6s ease;font-size:1.1rem;
  box-shadow:0 0 15px rgba(255,215,0,0.5),3px 3px 0 rgba(0,0,0,0.4)}
@keyframes orbFillBig{0%{transform:scale(0.3);opacity:0}50%{transform:scale(1.4)}100%{transform:scale(1.15);opacity:1}}

/* Hero Display */
.hero-area{display:flex;align-items:center;justify-content:center;min-height:100px;
  transition:transform 0.3s ease;position:relative;z-index:2}
.hero-area img{width:140px;height:140px;border-radius:50%;object-fit:cover;
  border:5px solid #000;box-shadow:0 0 0 4px #FFD700,6px 6px 0 rgba(0,0,0,0.5);
  transition:all 0.3s ease}
.hero-area.celebrate img{animation:heroCelebrateNew 1s ease;
  box-shadow:0 0 0 4px #FFD700,0 0 40px rgba(255,215,0,0.8)}
.hero-area.sad img{animation:heroSadNew 0.6s ease}
@keyframes heroCelebrateNew{0%{transform:scale(1)}20%{transform:scale(1.4) rotate(-8deg)}
  40%{transform:scale(1.5) rotate(8deg)}60%{transform:scale(1.3) rotate(-4deg)}
  80%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes heroSadNew{0%,100%{transform:translateY(0)}20%{transform:translateY(-10px)}
  40%{transform:translateY(6px)}60%{transform:translateY(-4px)}80%{transform:translateY(2px)}}

/* Question Area - Speech Bubble */
.question-area{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:500px;
  position:relative;z-index:2}
.speech-bubble{position:relative;background:rgba(255,255,255,0.12);border:3px solid rgba(255,255,255,0.3);
  border-radius:20px;padding:10px 18px;backdrop-filter:blur(6px)}
.speech-bubble::after{content:'';position:absolute;top:-14px;left:50%;transform:translateX(-50%);
  border:8px solid transparent;border-bottom-color:rgba(255,255,255,0.3)}
.speech-bubble.burst-bg{background:url('images/comics/burst-yellow.png') center/contain no-repeat,
  rgba(255,255,255,0.12);padding:20px 28px}
.prompt-text{font-family:'Bangers',cursive;font-size:1.8rem;color:#fff;text-align:center;
  -webkit-text-stroke:1px rgba(0,0,0,0.4);paint-order:stroke fill;
  letter-spacing:2px;text-shadow:2px 2px 0 rgba(0,0,0,0.3)}

/* Counting Items */
.count-items{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:14px;
  background:rgba(255,255,255,0.08);border-radius:20px;border:3px solid rgba(255,255,255,0.15);
  min-height:60px;max-width:380px}
.count-item{font-size:2rem;animation:itemBounceIn 0.4s ease both;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,0.3))}
@keyframes itemBounceIn{0%{transform:scale(0) rotate(-180deg);opacity:0}
  60%{transform:scale(1.3) rotate(15deg)}80%{transform:scale(0.9) rotate(-5deg)}
  100%{transform:scale(1) rotate(0deg);opacity:1}}

/* Equation Display */
.equation{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px 24px;
  background:rgba(0,0,0,0.3);border-radius:20px;border:4px solid #000;
  box-shadow:5px 5px 0 rgba(0,0,0,0.4)}
.eq-num{font-family:'Russo One',sans-serif;font-size:3.5rem;font-weight:900;color:#fff;
  -webkit-text-stroke:2px #000;paint-order:stroke fill;
  text-shadow:3px 3px 0 rgba(0,0,0,0.4);min-width:55px;text-align:center}
.eq-op{font-family:'Bangers',cursive;font-size:2.5rem}
.eq-op.add{color:#69F0AE;-webkit-text-stroke:1px #000}
.eq-op.sub{color:#FF8A80;-webkit-text-stroke:1px #000}
.eq-op.eq{color:#fff;-webkit-text-stroke:1px #000}
.eq-mystery{font-size:4rem;color:#FFD700;animation:mysteryGlow 1.5s ease-in-out infinite}
@keyframes mysteryGlow{0%,100%{text-shadow:3px 3px 0 rgba(0,0,0,0.4)}
  50%{text-shadow:0 0 30px rgba(255,215,0,0.8),3px 3px 0 rgba(0,0,0,0.4)}}

/* Item Groups */
.eq-items{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  position:relative;z-index:2}
.item-group{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;padding:8px 12px;
  background:rgba(255,255,255,0.08);border-radius:14px;max-width:170px;border:2px solid rgba(255,255,255,0.1)}
.small-item{font-size:1.2rem}
.big-num{font-family:'Russo One',sans-serif;font-size:2.2rem;color:#fff;margin-left:6px;
  -webkit-text-stroke:1px #000}
.eq-op-big{font-family:'Bangers',cursive;font-size:2.2rem}
.eq-op-big.add{color:#69F0AE;-webkit-text-stroke:1px #000}
.eq-op-big.sub{color:#FF8A80;-webkit-text-stroke:1px #000}

/* Answer Buttons - Comic 3D */
.answers{display:flex;gap:14px;justify-content:center;padding:10px 0;width:100%;max-width:420px;
  position:relative;z-index:2}
.answer-btn{flex:1;min-width:90px;min-height:90px;max-width:130px;border-radius:18px;
  border:5px solid #000;background:linear-gradient(180deg,#fff,#e8e8f0);
  font-family:'Russo One',sans-serif;font-size:3rem;font-weight:900;color:#222;
  cursor:pointer;touch-action:manipulation;transition:all 0.12s ease;
  box-shadow:6px 6px 0 #000;position:relative;-webkit-text-stroke:0.5px rgba(0,0,0,0.2)}
.answer-btn:active:not(.disabled):not(.correct):not(.wrong){
  transform:translateY(4px);box-shadow:2px 2px 0 #000}
.answer-btn.correct{background:linear-gradient(135deg,#4CAF50,#66BB6A);border-color:#1B5E20;color:#fff;
  transform:scale(1.12) translateY(-4px);box-shadow:0 0 30px rgba(76,175,80,0.7),6px 6px 0 #000;
  animation:correctPop 0.7s ease;-webkit-text-stroke:1px #000}
@keyframes correctPop{0%{transform:scale(1)}25%{transform:scale(1.25) rotate(-4deg)}
  50%{transform:scale(1.05) rotate(3deg)}75%{transform:scale(1.15)}100%{transform:scale(1.12)}}
.answer-btn.wrong{background:linear-gradient(135deg,#FF9800,#FFB74D);border-color:#E65100;
  color:#fff;animation:shake 0.5s ease;-webkit-text-stroke:1px #000}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-8px) rotate(-2deg)}
  30%{transform:translateX(8px) rotate(2deg)}45%{transform:translateX(-6px)}
  60%{transform:translateX(6px)}75%{transform:translateX(-3px)}90%{transform:translateX(3px)}}
.answer-btn.disabled{opacity:0.35;pointer-events:none}

/* Battle Mode */
.battle-area{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px;
  width:100%;max-width:520px;position:relative;z-index:2}
.battle-card{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 12px;
  border:5px solid #000;border-radius:20px;background:linear-gradient(180deg,#fff,#eee);
  cursor:pointer;touch-action:manipulation;transition:all 0.2s ease;
  box-shadow:5px 5px 0 #000;max-width:210px;position:relative;transform:rotate(-2deg)}
.battle-card:nth-child(3){transform:rotate(2deg)}
.battle-card:active:not(.winner):not(.loser){transform:scale(0.95) rotate(0deg);box-shadow:2px 2px 0 #000}
.battle-card img{width:85px;height:85px;border-radius:50%;object-fit:cover;
  border:4px solid #000;box-shadow:0 0 0 3px #FFD700}
.battle-num{font-family:'Russo One',sans-serif;font-size:3.5rem;
  -webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:3px 3px 0 rgba(0,0,0,0.15)}
.battle-name{font-family:'Bangers',cursive;font-size:1rem;color:#333;letter-spacing:1px}
.vs-text{font-family:'Bangers',cursive;font-size:2.5rem;color:#FFD700;
  -webkit-text-stroke:2px #000;paint-order:stroke fill;
  text-shadow:3px 3px 0 rgba(0,0,0,0.5);animation:vsBounce 1.2s ease-in-out infinite}
@keyframes vsBounce{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.3) rotate(5deg)}}
.battle-card.winner{background:linear-gradient(135deg,#4CAF50,#66BB6A);border-color:#1B5E20;
  color:#fff;transform:scale(1.12) rotate(0deg);
  box-shadow:0 0 30px rgba(76,175,80,0.6),5px 5px 0 #000;animation:battleWinNew 0.7s ease}
.battle-card.winner .battle-num{color:#fff}
.battle-card.winner .battle-name{color:rgba(255,255,255,0.9)}
.battle-card.loser{opacity:0.4;transform:scale(0.85);filter:grayscale(0.6)}
@keyframes battleWinNew{0%{transform:scale(1)}30%{transform:scale(1.2) rotate(-4deg)}
  60%{transform:scale(1.08) rotate(3deg)}100%{transform:scale(1.12) rotate(0)}}

/* Results Overlay */
.results-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:50;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:rgba(10,10,46,0.95);backdrop-filter:blur(10px);padding:20px;overflow-y:auto}
.results-comic-frame{position:absolute;top:10px;right:10px;width:100px;height:auto;opacity:0.15;
  pointer-events:none;z-index:0}
.results-comic-frame-left{position:absolute;bottom:10px;left:10px;width:100px;height:auto;opacity:0.15;
  pointer-events:none;z-index:0;transform:scaleX(-1)}

/* Speed lines behind results */
.results-overlay::before{content:'';position:absolute;top:50%;left:50%;width:600px;height:600px;
  transform:translate(-50%,-50%);
  background:conic-gradient(from 0deg,transparent 0deg,rgba(255,215,0,0.05) 5deg,transparent 10deg,
  rgba(226,54,54,0.03) 15deg,transparent 20deg);
  border-radius:50%;animation:rayRotate 15s linear infinite;pointer-events:none}

.results-hero{text-align:center;margin-bottom:8px;position:relative;z-index:1}
.results-hero img{width:130px;height:130px;border-radius:50%;object-fit:cover;
  border:5px solid #000;box-shadow:0 0 0 4px #FFD700,0 0 40px rgba(255,215,0,0.4);
  animation:resultsHeroIn 0.8s ease}
@keyframes resultsHeroIn{0%{transform:scale(0) rotate(-30deg);opacity:0}
  60%{transform:scale(1.2) rotate(5deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.results-title{font-family:'Bangers',cursive;font-size:2.5rem;text-align:center;
  color:#FFD700;-webkit-text-stroke:2px #000;paint-order:stroke fill;
  text-shadow:3px 3px 0 #C62828;letter-spacing:2px;
  animation:titleGlowResult 2s ease-in-out infinite;position:relative;z-index:1}
@keyframes titleGlowResult{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.results-stars{font-size:2.2rem;text-align:center;padding:10px 0;position:relative;z-index:1}
.results-stars .star{display:inline-block;opacity:0;animation:starAppear 0.4s ease forwards}

.results-btn-retry{background:linear-gradient(135deg,#4CAF50,#2E7D32)}

.unlock-box{text-align:center;padding:16px;margin:10px 0;

.unlock-title{font-family:'Bangers',cursive;font-size:1.6rem;color:#FFD700;margin-bottom:8px;

.unlock-name{font-family:'Bangers',cursive;font-size:1.3rem;color:#fff;margin-top:8px;

.teams-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team-card{position:relative;border:4px solid #000;border-radius:14px;overflow:hidden;

.team-card.full-width{grid-column:1 / -1}

.team-card:hover .team-card-header svg{transform:scale(1.15) rotate(5deg)}
.team-card-name{font-family:'Bangers',cursive;font-size:1.2rem;color:#fff;
  -webkit-text-stroke:1px #000;paint-order:stroke fill;letter-spacing:1px;
  text-shadow:2px 2px 0 rgba(0,0,0,0.5)}

/* Comic-panel halftone overlay on team cards */
.team-card::after{content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(circle,rgba(0,0,0,0.08) 1px,transparent 1px);
  background-size:4px 4px;pointer-events:none;z-index:1}

/* Team members row */
.team-members{display:flex;justify-content:center;gap:4px;padding:6px 8px;flex-wrap:wrap;position:relative;z-index:2}
.team-member{width:40px;height:40px;border-radius:50%;object-fit:cover;
  border:3px solid #000;box-shadow:0 0 0 2px #FFD700;transition:transform 0.3s}
.team-member:hover{transform:scale(1.15)}
.team-member.locked-member{filter:grayscale(0.9);opacity:0.4;box-shadow:0 0 0 2px #555}

/* Team-specific colors */
.team-avengers{background:linear-gradient(135deg,#1565C0,#0D47A1)}

.team-villains{background:linear-gradient(135deg,#4A148C,#1a0033)}
.team-cosmic{background:linear-gradient(135deg,#00695C,#004D40)}
.team-marvel{background:linear-gradient(180deg,#E23636,#B71C1C)}

.team-card.team-complete{box-shadow:4px 4px 0 rgba(0,0,0,0.5),0 0 15px rgba(255,215,0,0.3)}
.team-card.team-complete .comic-corner{border-top-color:rgba(255,215,0,0.7)}

.team-card .speed-lines{position:absolute;top:0;left:0;width:100%;height:100%;
  background:repeating-linear-gradient(90deg,transparent,transparent 8px,rgba(255,255,255,0.03) 8px,rgba(255,255,255,0.03) 10px);
  pointer-events:none;z-index:0}

/* Marvel banner logo */
.marvel-banner{width:100%;max-width:520px;padding:6px 12px;position:relative;z-index:1;

  animation:marvelGlow 3s ease-in-out infinite}
@keyframes marvelGlow{0%,100%{filter:drop-shadow(0 2px 6px rgba(244,67,54,0.5))}
  50%{filter:drop-shadow(0 2px 12px rgba(244,67,54,0.8))}}
.marvel-banner-line{flex:1;height:3px;background:linear-gradient(90deg,transparent,#E23636,transparent);border-radius:2px}

/* Comic panel decorative corner */
.team-card .comic-corner{position:absolute;top:0;right:0;width:0;height:0;
  border-left:20px solid transparent;border-top:20px solid rgba(255,215,0,0.4);z-index:3}

@media (max-width:600px){
  .teams-grid{gap:8px}
  .team-card{min-height:100px}
  .team-member{width:34px;height:34px}
  .team-card-name{font-size:1rem}
  .teams-title{font-size:1.5rem}

function toggleFullscreen(){
  if(!document.fullscreenElement&&!document.webkitFullscreenElement){
    const el=document.documentElement;
    if(el.requestFullscreen) el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } else {
    if(document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
}

// ===== SPEECH MODULE =====
const Speech = {
  _voice:null,_ready:false,_useFallback:false,_initPromise:null,_fallbackAudio:null,
  _sequenceTimeouts:[],_isSpeaking:false,
  init(){
    if(this._initPromise) return this._initPromise;
    this._initPromise = new Promise(resolve=>{
      if(!window.speechSynthesis){this._useFallback=true;this._ready=true;resolve(true);return}
      const findVoice=()=>{
        const voices=speechSynthesis.getVoices();
        this._voice=voices.find(v=>/he[-_]IL/i.test(v.lang))||voices.find(v=>/^he/i.test(v.lang));
        if(this._voice){this._ready=true;this._useFallback=false;resolve(true);return true}
        return false};
      if(findVoice()) return;
      const onVC=()=>{if(findVoice()) speechSynthesis.removeEventListener('voiceschanged',onVC)};
      speechSynthesis.addEventListener('voiceschanged',onVC);
      let att=0;const iv=setInterval(()=>{att++;
        if(findVoice()||att>15){clearInterval(iv);speechSynthesis.removeEventListener('voiceschanged',onVC);
          if(!this._ready){this._useFallback=true;this._ready=true;resolve(true)}}},200)});
    return this._initPromise},
  speak(text){if(!this._ready||!text) return;this._clearSequence();
    if(this._useFallback) this._speakFallback(text);else this._speakNative(text)},
  speakSequence(segments,pauseMs){if(!this._ready||!segments||segments.length===0) return;
    pauseMs=pauseMs||800;this.stop();
    if(this._useFallback) this._speakFallbackSequence(segments,pauseMs);
    else this._speakNativeSequence(segments,pauseMs)},
  _speakNative(text){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);
    u.voice=this._voice;u.lang='he-IL';u.rate=0.75;u.pitch=1.05;speechSynthesis.speak(u)},
  _speakNativeSequence(segments,pauseMs){this._isSpeaking=true;let idx=0;
    const next=()=>{if(!this._isSpeaking||idx>=segments.length){this._isSpeaking=false;return}
      const text=segments[idx];idx++;if(!text){next();return}
      const u=new SpeechSynthesisUtterance(text);u.voice=this._voice;u.lang='he-IL';u.rate=0.75;u.pitch=1.05;
      u.onend=()=>{if(idx<segments.length&&this._isSpeaking){const t=setTimeout(next,pauseMs);this._sequenceTimeouts.push(t)}else this._isSpeaking=false};
      u.onerror=()=>{if(this._isSpeaking){const t=setTimeout(next,pauseMs);this._sequenceTimeouts.push(t)}};
      speechSynthesis.speak(u)};next()},
  _speakFallback(text){this._stopFallbackAudio();try{const chunks=this._chunkText(text,180);
    if(chunks.length===1) this._playFallbackChunk(chunks[0]);
    else this._speakFallbackSequence(chunks,300)}catch(e){}},
  _speakFallbackSequence(segments,pauseMs){this._isSpeaking=true;let idx=0;
    const playNext=()=>{if(!this._isSpeaking||idx>=segments.length){this._isSpeaking=false;return}
      const text=segments[idx];idx++;if(!text){playNext();return}
      const chunks=this._chunkText(text,180);let ci=0;
      const playChunk=()=>{if(!this._isSpeaking||ci>=chunks.length){
        if(idx<segments.length&&this._isSpeaking){const t=setTimeout(playNext,pauseMs);this._sequenceTimeouts.push(t)}
        else this._isSpeaking=false;return}
        this._playFallbackChunk(chunks[ci],()=>{ci++;
          if(ci<chunks.length){const t=setTimeout(playChunk,200);this._sequenceTimeouts.push(t)}
          else playChunk()})};playChunk()};playNext()},
  _playFallbackChunk(text,onEnd){try{const enc=encodeURIComponent(text);
    const url='https://translate.google.com/translate_tts?ie=UTF-8&tl=iw&client=tw-ob&q='+enc;
    this._fallbackAudio=new Audio(url);this._fallbackAudio.playbackRate=0.75;
    if(onEnd){this._fallbackAudio.addEventListener('ended',onEnd,{once:true});
      this._fallbackAudio.addEventListener('error',onEnd,{once:true})}
    this._fallbackAudio.play().catch(()=>{if(onEnd) onEnd()})}catch(e){if(onEnd) onEnd()}},
  _chunkText(text,maxLen){const enc=encodeURIComponent(text);if(enc.length<=maxLen) return [text];
    const words=text.split(' ');const chunks=[];let cur='';
    for(let i=0;i<words.length;i++){const cand=cur?cur+' '+words[i]:words[i];
      if(encodeURIComponent(cand).length>maxLen&&cur){chunks.push(cur);cur=words[i]}else cur=cand}
    if(cur) chunks.push(cur);return chunks},
  _clearSequence(){this._isSpeaking=false;this._sequenceTimeouts.forEach(t=>clearTimeout(t));this._sequenceTimeouts=[]},
  _stopFallbackAudio(){if(this._fallbackAudio){this._fallbackAudio.pause();this._fallbackAudio.currentTime=0;this._fallbackAudio=null}},
  stop(){this._clearSequence();if(window.speechSynthesis) speechSynthesis.cancel();this._stopFallbackAudio()}
};

// ===== ADAPTIVE DIFFICULTY ENGINE (STARTS BELOW 10!) =====
const Adaptive = {
  _defaultSkill(){return {level:1,streak:0,wrongStreak:0,totalCorrect:0,totalWrong:0}},
  _state:null,
  getState(){
    if(!this._state){this._state=Storage.getHeroMathAdaptive()||{
      counting:this._defaultSkill(),addition:this._defaultSkill(),
      subtraction:this._defaultSkill(),comparison:this._defaultSkill(),
      heroesUnlocked:['spiderman'],totalStars:0,roundsCompleted:0}}
    return this._state},
  save(){Storage.saveHeroMathAdaptive(this._state)},
  recordCorrect(skill){const s=this.getState()[skill];if(!s) return;
    s.streak++;s.wrongStreak=0;s.totalCorrect++;
    if(s.streak>=3&&s.level<5){s.level++;s.streak=0;this.save();return 'level_up'}
    this.save();return 'correct'},
  recordWrong(skill){const s=this.getState()[skill];if(!s) return;
    s.streak=0;s.wrongStreak++;s.totalWrong++;
    if(s.wrongStreak>=2&&s.level>1){s.level--;s.wrongStreak=0;this.save();return 'level_down'}
    this.save();return 'wrong'},
  getLevel(skill){return this.getState()[skill]?.level||1},
  unlockNextHero(){const st=this.getState();st.roundsCompleted++;
    if(st.roundsCompleted%2===0){const allIds=HEROES_DATA.map(h=>h.id);
      const locked=allIds.filter(id=>!st.heroesUnlocked.includes(id));
      if(locked.length>0){st.heroesUnlocked.push(locked[0]);this.save();return locked[0]}}
    this.save();return null},
  addStars(c){this.getState().totalStars+=c;this.save()},

  // COUNTING: starts from 3-7 (below 10!)
  generateCounting(){const lv=this.getLevel('counting');let mn,mx;
    switch(lv){
      case 1:mn=3;mx=7;break;     // below 10
      case 2:mn=5;mx=10;break;    // around 10
      case 3:mn=8;mx=15;break;    // teens
      case 4:mn=11;mx=20;break;   // teens-20s
      case 5:mn=15;mx=30;break;   // bigger
      default:mn=3;mx=7}
    const ans=mn+Math.floor(Math.random()*(mx-mn+1));
    return {answer:ans,distractors:this._dist(ans,mn,mx),level:lv}},

  // ADDITION: starts from small sums below 10
  generateAddition(){const lv=this.getLevel('addition');let a,b;
    switch(lv){
      case 1: // sum ≤ 8
        b=1+Math.floor(Math.random()*2); // 1 or 2
        a=2+Math.floor(Math.random()*(8-b-2+1));break;
      case 2: // sum ≤ 12
        b=1+Math.floor(Math.random()*4);
        a=2+Math.floor(Math.random()*(12-b-2+1));break;
      case 3: // sum ≤ 18
        b=2+Math.floor(Math.random()*5);
        a=3+Math.floor(Math.random()*(18-b-3+1));break;
      case 4: // sum ≤ 25
        b=2+Math.floor(Math.random()*8);
        a=5+Math.floor(Math.random()*(25-b-5+1));break;
      case 5: // sum ≤ 50
        b=3+Math.floor(Math.random()*10);
        a=8+Math.floor(Math.random()*(50-b-8+1));break;
      default:a=3;b=2}
    const ans=a+b;return {a,b,answer:ans,distractors:this._dist(ans,Math.max(ans-4,1),ans+4),operation:'+',level:lv}},

  // SUBTRACTION: starts from small numbers below 10
  generateSubtraction(){const lv=this.getLevel('subtraction');let a,b;
    switch(lv){
      case 1: // minuend ≤ 8, -1 or -2
        b=1+Math.floor(Math.random()*2);
        a=4+Math.floor(Math.random()*5);break; // 4-8
      case 2: // minuend ≤ 12
        b=1+Math.floor(Math.random()*3);
        a=5+Math.floor(Math.random()*8);break;
      case 3: // minuend ≤ 18
        b=2+Math.floor(Math.random()*4);
        a=8+Math.floor(Math.random()*11);break;
      case 4: // minuend ≤ 25
        b=2+Math.floor(Math.random()*7);
        a=10+Math.floor(Math.random()*16);break;
      case 5: // minuend ≤ 50
        b=3+Math.floor(Math.random()*12);
        a=18+Math.floor(Math.random()*33);break;
      default:a=7;b=2}
    if(a-b<1) a=b+1+Math.floor(Math.random()*3);
    const ans=a-b;return {a,b,answer:ans,distractors:this._dist(ans,Math.max(ans-4,0),ans+4),operation:'-',level:lv}},

  // COMPARISON: starts from small numbers below 10
  generateComparison(){const lv=this.getLevel('comparison');let minGap,maxNum,minNum;
    switch(lv){
      case 1:minNum=2;maxNum=9;minGap=4;break;   // small, easy
      case 2:minNum=3;maxNum=15;minGap=3;break;
      case 3:minNum=5;maxNum=20;minGap=2;break;
      case 4:minNum=8;maxNum=35;minGap=1;break;
      case 5:minNum=10;maxNum=50;minGap=1;break;
      default:minNum=2;maxNum=9;minGap=4}
    const gap=minGap+Math.floor(Math.random()*3);
    let numA=minNum+Math.floor(Math.random()*(maxNum-gap-minNum+1));
    let numB=numA+gap;
    if(Math.random()<0.5)[numA,numB]=[numB,numA];
    return {numA,numB,answer:Math.max(numA,numB),level:lv}},

  _dist(ans,mn,mx){const opts=new Set([ans]);let att=0;
    while(opts.size<3&&att<50){att++;let d;
      if(Math.random()<0.5) d=ans+(1+Math.floor(Math.random()*3))*(Math.random()<0.5?1:-1);
      else d=mn+Math.floor(Math.random()*(mx-mn+1));
      if(d>=1&&d!==ans) opts.add(d)}
    while(opts.size<3) opts.add(ans+opts.size);
    return Array.from(opts).sort(()=>Math.random()-0.5)}
};

// ===== PARTICLE SYSTEM =====
const Particles = {
  canvas:null,ctx:null,particles:[],animId:null,
  init(){this.canvas=document.getElementById('particles-canvas');
    this.ctx=this.canvas.getContext('2d');this._resize();
    window.addEventListener('resize',()=>this._resize())},
  _resize(){this.canvas.width=window.innerWidth;this.canvas.height=window.innerHeight},
  spawn(x,y,color,count){for(let i=0;i<count;i++){
    const angle=Math.random()*Math.PI*2;const speed=2+Math.random()*6;
    const size=3+Math.random()*5;
    this.particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
      size,color:color||this._randColor(),life:1,decay:0.015+Math.random()*0.02,
      type:'circle'})}
    if(!this.animId) this._animate()},
  spawnStars(x,y,color,count){for(let i=0;i<count;i++){
    const angle=Math.random()*Math.PI*2;const speed=3+Math.random()*5;
    this.particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
      size:6+Math.random()*8,color:color||'#FFD700',life:1,decay:0.012+Math.random()*0.015,
      type:'star'})}
    if(!this.animId) this._animate()},
  spawnConfetti(count){for(let i=0;i<count;i++){
    const x=Math.random()*this.canvas.width;const y=-20-Math.random()*100;
    this.particles.push({x,y,vx:(Math.random()-0.5)*3,vy:1+Math.random()*3,
      size:6+Math.random()*6,color:this._randColor(),life:1,decay:0.003+Math.random()*0.005,
      type:'confetti',rot:Math.random()*360,rotSpeed:(Math.random()-0.5)*10})}
    if(!this.animId) this._animate()},
  _randColor(){const colors=['#FF6347','#FFD700','#00BFFF','#FF1493','#7FFF00','#FF4500','#9400D3','#00FF7F'];
    return colors[Math.floor(Math.random()*colors.length)]},
  _animate(){this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
    this.particles=this.particles.filter(p=>{
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life-=p.decay;
      if(p.life<=0) return false;
      this.ctx.save();this.ctx.globalAlpha=p.life;
      if(p.type==='star'){this._drawStar(p.x,p.y,p.size,p.color)}
      else if(p.type==='confetti'){this.ctx.translate(p.x,p.y);
        p.rot+=p.rotSpeed;this.ctx.rotate(p.rot*Math.PI/180);
        this.ctx.fillStyle=p.color;this.ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);
        this.ctx.setTransform(1,0,0,1,0,0)}
      else{this.ctx.fillStyle=p.color;this.ctx.beginPath();
        this.ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);this.ctx.fill()}
      this.ctx.restore();return true});
    if(this.particles.length>0) this.animId=requestAnimationFrame(()=>this._animate());
    else{this.animId=null;this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height)}},
  _drawStar(cx,cy,size,color){this.ctx.fillStyle=color;this.ctx.beginPath();
    for(let i=0;i<5;i++){const angle=i*Math.PI*2/5-Math.PI/2;
      const ox=cx+Math.cos(angle)*size;const oy=cy+Math.sin(angle)*size;
      if(i===0) this.ctx.moveTo(ox,oy);else this.ctx.lineTo(ox,oy);
      const ia=angle+Math.PI/5;this.ctx.lineTo(cx+Math.cos(ia)*size*0.4,cy+Math.sin(ia)*size*0.4)}
    this.ctx.closePath();this.ctx.fill()}
};

// ===== MAIN GAME =====
const Game = {
  currentMode:null,currentHero:null,state:null,timeouts:[],QUESTIONS:8,roundStreak:0,
  _initialized:false,

  init(){
    if(this._initialized) return;
    this._initialized=true;
    document.getElementById('btn-counting').addEventListener('click',()=>this.startMode('counting'));
    document.getElementById('btn-mission').addEventListener('click',()=>this.startMode('mission'));
    document.getElementById('btn-battle').addEventListener('click',()=>this.startMode('battle'));
    document.getElementById('back-btn').addEventListener('click',()=>this.showMenu());
    document.getElementById('btn-retry').addEventListener('click',()=>this.startMode(this.currentMode));
    document.getElementById('btn-results-menu').addEventListener('click',()=>this.showMenu());
    Particles.init();
    this.showMenu();
  },

  cleanup(){this.timeouts.forEach(t=>clearTimeout(t));this.timeouts=[];Speech.stop()},
  _t(fn,ms){const t=setTimeout(fn,ms);this.timeouts.push(t);return t},

  // ===== MENU =====
  showMenu(){
    this.cleanup();
    this._showScreen('menu-screen');
    this._updateMenuStats();
    this._buildTeams();
    this._t(()=>Speech.speak('בוא נשחק עם גיבורי על'),500);
    Sounds.whoosh();
  },

  _showScreen(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.getElementById('results-overlay').style.display='none';
  },

  _updateMenuStats(){
    const st=Adaptive.getState();
    document.getElementById('star-counter').textContent='⭐ '+st.totalStars;
    const row=document.getElementById('collection-row');
    row.innerHTML=HEROES_DATA.map(h=>{
      const unlocked=st.heroesUnlocked.includes(h.id);
      return `<span class="collection-badge ${unlocked?'unlocked':'locked'}"
        style="${unlocked?'background:'+h.color+';border-color:'+h.color:'background:#222;border-color:#444'}">
        <img src="${h.image}" alt="${h.name_he}" onerror="this.parentElement.textContent='${unlocked?h.emoji:'🔒'}'">
      </span>`}).join('');
  },

  _buildTeams(){
    const st=Adaptive.getState();
    const grid=document.getElementById('teams-grid');
    grid.innerHTML=TEAMS_DATA.map((team,idx)=>{
      const membersHtml=team.members.map(mid=>{
        const hero=HEROES_DATA.find(h=>h.id===mid);
        if(!hero) return '';
        const isUnlocked=st.heroesUnlocked.includes(mid);
        return `<img class="team-member ${isUnlocked?'':'locked-member'}" src="${hero.image}" alt="${hero.name_he}"
          onerror="this.style.display='none'" title="${hero.name_he}">`;
      }).join('');
      const fullWidth=team.members.length>5?'full-width':'';
      const allUnlocked=team.members.every(mid=>st.heroesUnlocked.includes(mid));
      const teamComplete=allUnlocked?'team-complete':'';
      return `<div class="team-card ${team.cssClass} ${fullWidth} ${teamComplete}">
        <div class="speed-lines"></div>
        <div class="comic-corner"></div>
        <div class="team-card-header">${team.logo}<span class="team-card-name">${team.name_he}</span>${allUnlocked?'<span style="font-size:0.8rem;margin-right:4px">✓</span>':''}</div>
        <div class="team-members">${membersHtml}</div>
      </div>`;
    }).join('');
  },

  _pickHero(){
    const st=Adaptive.getState();
    const unlocked=HEROES_DATA.filter(h=>st.heroesUnlocked.includes(h.id));
    return unlocked[Math.floor(Math.random()*unlocked.length)]},

  // ===== COUNTDOWN =====
  _doCountdown(cb){
    const overlay=document.getElementById('countdown-overlay');
    const numEl=document.getElementById('countdown-number');
    overlay.style.display='flex';
    const steps=['3','2','1','!קדימה'];
    const heSteps=['שלוש','שתיים','אחת','קדימה'];
    const colors=['#FF6347','#FFD700','#00BFFF','#7FFF00'];
    let i=0;
    const next=()=>{
      if(i>=steps.length){overlay.style.display='none';cb();return}
      numEl.textContent=steps[i];numEl.style.color=colors[i];
      numEl.style.animation='none';numEl.offsetHeight;numEl.style.animation='countZoom 0.7s ease';
      if(i<3) Sounds.countdown(); else Sounds.countdownGo();
      Speech.speak(heSteps[i]);
      i++;this._t(next,800)};
    next();
  },

  // ===== START MODE =====
  startMode(mode){
    this.cleanup();this.currentMode=mode;this.currentHero=this._pickHero();this.roundStreak=0;
    this.state={questionIndex:0,score:0,questions:[],answered:false};
    const modeNames={counting:'ספירת כוח',mission:'משימת גיבורים',battle:'קרב מספרים'};
    Speech.speak(modeNames[mode]);
    Sounds.whoosh();

    for(let i=0;i<this.QUESTIONS;i++){
      if(mode==='counting') this.state.questions.push(Adaptive.generateCounting());
      else if(mode==='mission'){
        const sl=Adaptive.getLevel('subtraction');
        if(sl>=2&&Math.random()<0.4) this.state.questions.push(Adaptive.generateSubtraction());
        else this.state.questions.push(Adaptive.generateAddition());
      } else if(mode==='battle') this.state.questions.push(Adaptive.generateComparison());
    }

    this._showScreen('game-screen');
    const gs=document.getElementById('game-screen');
    gs.style.background=this.currentHero.gradient;

    this._t(()=>{
      this._doCountdown(()=>{
        this._t(()=>Speech.speak(this.currentHero.phrases.intro),200);
        this._t(()=>this._showQuestion(),800);
      });
    },300);
  },

  // ===== SHOW QUESTION =====
  _showQuestion(){
    const {questionIndex,questions}=this.state;
    if(questionIndex>=questions.length){this._showResults();return}
    this.state.answered=false;
    const q=questions[questionIndex];
    document.getElementById('progress-text').textContent=`${questionIndex+1}/${questions.length}`;
    this._updatePowerMeter();
    const heroArea=document.getElementById('hero-area');
    heroArea.innerHTML=`<img src="${this.currentHero.image}" alt="${this.currentHero.name_he}"
      onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<span style=\\'font-size:7rem\\'>${this.currentHero.emoji}</span>')">`;
    heroArea.className='hero-area';
    const qArea=document.getElementById('question-area');
    const aArea=document.getElementById('answers-area');
    if(this.currentMode==='counting') this._showCounting(q,qArea,aArea);
    else if(this.currentMode==='mission') this._showMission(q,qArea,aArea);
    else if(this.currentMode==='battle') this._showBattle(q,qArea,aArea);
  },

  // ===== COUNTING MODE =====
  _showCounting(q,qArea,aArea){
    const hero=this.currentHero;const count=q.answer;
    let items='<div class="count-items">';
    for(let i=0;i<count;i++) items+=`<span class="count-item" style="animation-delay:${i*0.1}s">${hero.powerEmoji}</span>`;
    items+='</div>';
    qArea.innerHTML=`<div class="speech-bubble burst-bg"><div class="prompt-text">?כמה ${hero.powerName_he} יש</div>${items}</div>`;
    this._t(()=>Speech.speak(`כמה ${hero.powerName_he} יש? ספור אותם`),300);
    this._showAnswerBtns(q.distractors,q.answer,aArea,'counting');
  },

  // ===== MISSION MODE =====
  _showMission(q,qArea,aArea){
    const hero=this.currentHero;const isAdd=q.operation==='+';
    const opSym=isAdd?'+':'−';const opWord=isAdd?'ועוד':'פחות';
    const opClass=isAdd?'add':'sub';
    qArea.innerHTML=`
      <div class="speech-bubble">
        <div class="prompt-text">${hero.name_he}</div>
        <div class="equation">
          <span class="eq-num">${q.a}</span>
          <span class="eq-op ${opClass}">${opSym}</span>
          <span class="eq-num">${q.b}</span>
          <span class="eq-op eq">=</span>
          <span class="eq-num eq-mystery">?</span>
        </div>
      </div>
      <div class="eq-items">
        ${this._renderItemGroup(q.a,hero.powerEmoji)}
        <span class="eq-op-big ${opClass}">${opSym}</span>
        ${this._renderItemGroup(q.b,hero.powerEmoji)}
      </div>`;
    const nA=HEBREW_NUMBERS[q.a]||q.a;const nB=HEBREW_NUMBERS[q.b]||q.b;
    this._t(()=>Speech.speak(`${nA} ${opWord} ${nB} שווה?`),300);
    this._showAnswerBtns(q.distractors,q.answer,aArea,q.operation==='+'?'addition':'subtraction');
  },

  _renderItemGroup(count,emoji){
    if(count>15) return `<span class="item-group"><span class="big-num">${count}</span><span>${emoji}</span></span>`;
    let h='<span class="item-group">';
    for(let i=0;i<count;i++) h+=`<span class="small-item">${emoji}</span>`;
    return h+'</span>';
  },

  // ===== BATTLE MODE =====
  _showBattle(q,qArea,aArea){
    const st=Adaptive.getState();
    const unlocked=HEROES_DATA.filter(h=>st.heroesUnlocked.includes(h.id));
    let heroA=unlocked[Math.floor(Math.random()*unlocked.length)];
    let heroB=unlocked[Math.floor(Math.random()*unlocked.length)];
    if(unlocked.length>1) while(heroB.id===heroA.id) heroB=unlocked[Math.floor(Math.random()*unlocked.length)];
    qArea.innerHTML=`
      <div class="speech-bubble" style="background:url('images/comics/burst-purple.png') center/contain no-repeat,rgba(255,255,255,0.12);padding:20px 28px"><div class="prompt-text">?מי חזק יותר</div></div>
      <div class="battle-area">
        <button class="battle-card" data-num="${q.numA}" style="border-color:${heroA.color}">
          <img src="${heroA.image}" alt="${heroA.name_he}" onerror="this.outerHTML='<span style=\\'font-size:4rem\\'>${heroA.emoji}</span>'">
          <span class="battle-num" style="color:${heroA.color}">${q.numA}</span>
          <span class="battle-name">${heroA.name_he}</span>
        </button>
        <span class="vs-text">⚡VS⚡</span>
        <button class="battle-card" data-num="${q.numB}" style="border-color:${heroB.color}">
          <img src="${heroB.image}" alt="${heroB.name_he}" onerror="this.outerHTML='<span style=\\'font-size:4rem\\'>${heroB.emoji}</span>'">
          <span class="battle-num" style="color:${heroB.color}">${q.numB}</span>
          <span class="battle-name">${heroB.name_he}</span>
        </button>
      </div>`;
    aArea.innerHTML='';
    const nA=HEBREW_NUMBERS[q.numA]||q.numA;const nB=HEBREW_NUMBERS[q.numB]||q.numB;
    this._t(()=>Speech.speak(`${nA} או ${nB}? מי חזק יותר? מי יש לו יותר?`),300);
    const cards=qArea.querySelectorAll('.battle-card');
    cards.forEach(card=>{card.addEventListener('click',()=>{
      if(this.state.answered) return;
      this._handleBattle(parseInt(card.dataset.num),q.answer,cards)})});
  },

  _handleBattle(chosen,correct,cards){
    this.state.answered=true;
    cards.forEach(card=>{const num=parseInt(card.dataset.num);
      if(num===correct) card.classList.add('winner');else card.classList.add('loser')});
    if(chosen===correct){
      this.state.score++;this.roundStreak++;
      const result=Adaptive.recordCorrect('comparison');
      Sounds.powerUp();this._correctEffects(result==='level_up');
      this._t(()=>{const nh=HEBREW_NUMBERS[correct]||correct;Speech.speak(`${nh} יותר גדול!`)},1200);
    } else {
      this.roundStreak=0;Adaptive.recordWrong('comparison');Sounds.wrong();this._wrongEffects();
      this._t(()=>{const nh=HEBREW_NUMBERS[correct]||correct;Speech.speak(`${nh} יותר גדול`)},1200);
    }
    this._updatePowerMeter();
    this._t(()=>this._nextQuestion(),2500);
  },

  // ===== ANSWER BUTTONS =====
  _showAnswerBtns(options,answer,container,skill){
    container.innerHTML=options.map(num=>`<button class="answer-btn" data-num="${num}">${num}</button>`).join('');
    container.querySelectorAll('.answer-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{
        if(this.state.answered) return;
        this._handleAnswer(parseInt(btn.dataset.num),answer,container,skill)})});
  },

  _handleAnswer(chosen,correct,container,skill){
    this.state.answered=true;
    const btns=container.querySelectorAll('.answer-btn');
    btns.forEach(btn=>{const num=parseInt(btn.dataset.num);btn.classList.add('disabled');
      if(num===correct) btn.classList.add('correct');
      else if(num===chosen&&num!==correct) btn.classList.add('wrong')});
    if(chosen===correct){
      this.state.score++;this.roundStreak++;
      const result=Adaptive.recordCorrect(skill);
      Sounds.powerUp();this._correctEffects(result==='level_up');
      this._t(()=>{const nh=HEBREW_NUMBERS[correct]||correct;Speech.speak(`${nh}!`)},1000);
    } else {
      this.roundStreak=0;Adaptive.recordWrong(skill);Sounds.wrong();this._wrongEffects();
      this._t(()=>{const nh=HEBREW_NUMBERS[correct]||correct;Speech.speak(`התשובה היא ${nh}`)},1200);
    }
    this._updatePowerMeter();
    this._t(()=>this._nextQuestion(),2800);
  },

  // ===== EFFECTS =====
  _correctEffects(isLevelUp){
    const heroArea=document.getElementById('hero-area');
    heroArea.classList.add('celebrate');
    const flash=document.getElementById('screen-flash');
    flash.style.background='rgba(255,215,0,0.3)';flash.style.opacity='1';
    setTimeout(()=>{flash.style.opacity='0'},150);
    const rect=heroArea.getBoundingClientRect();
    const cx=rect.left+rect.width/2;const cy=rect.top+rect.height/2;
    Particles.spawnStars(cx,cy,this.currentHero.color,15);
    Particles.spawn(cx,cy,this.currentHero.color,10);
    this._showActionWord();
    this._checkStreak();
    this._speakPraise(isLevelUp);
  },

  _wrongEffects(){
    const heroArea=document.getElementById('hero-area');
    heroArea.classList.add('sad');
    const flash=document.getElementById('screen-flash');
    flash.style.background='rgba(255,100,0,0.15)';flash.style.opacity='1';
    setTimeout(()=>{flash.style.opacity='0'},200);
    this._speakEncourage();
  },

  _showActionWord(){
    const el=document.getElementById('action-word');
    const word=ACTION_WORDS[Math.floor(Math.random()*ACTION_WORDS.length)];
    const imgSrc=ACTION_IMAGES[word];
    if(imgSrc){
      el.className='';el.innerHTML=`<img src="${imgSrc}" alt="${word}">`;
    } else {
      el.className='text-mode';el.innerHTML=word;
    }
    el.style.top=(20+Math.random()*30)+'%';
    el.style.left=(15+Math.random()*50)+'%';
    el.style.display='block';el.style.animation='none';
    el.offsetHeight;el.style.animation='actionPop 0.8s ease forwards';
    setTimeout(()=>{el.style.display='none'},900);
  },

  _checkStreak(){
    const banner=document.getElementById('streak-banner');
    let text=null;
    if(this.roundStreak===3){text='🔥 !שלוש ברצף';Sounds.combo()}
    else if(this.roundStreak===5){text='🔥🔥 !חמש ברצף! מדהים';Sounds.combo();
      Particles.spawnConfetti(30)}
    else if(this.roundStreak===8){text='🏆 !מושלם! שמונה ברצף';Sounds.celebration();
      Particles.spawnConfetti(60)}
    if(text){
      banner.textContent=text;banner.style.display='block';
      banner.style.animation='none';banner.offsetHeight;
      banner.style.animation='streakPop 1.2s ease forwards';
      this._t(()=>{banner.style.display='none'},1300);
      this._t(()=>Speech.speak(text.replace(/[🔥🏆]/g,'').replace('!','')),200);
    }
  },

  _nextQuestion(){
    this.state.questionIndex++;
    const remaining=this.QUESTIONS-this.state.questionIndex;
    for(let i=0;i<remaining;i++){
      const idx=this.state.questionIndex+i;
      if(this.currentMode==='counting') this.state.questions[idx]=Adaptive.generateCounting();
      else if(this.currentMode==='mission'){
        const sl=Adaptive.getLevel('subtraction');
        if(sl>=2&&Math.random()<0.4) this.state.questions[idx]=Adaptive.generateSubtraction();
        else this.state.questions[idx]=Adaptive.generateAddition();
      } else if(this.currentMode==='battle') this.state.questions[idx]=Adaptive.generateComparison();
    }
    this._showQuestion();
  },

  // ===== POWER METER =====
  _updatePowerMeter(){
    const meter=document.getElementById('power-meter');if(!meter) return;
    const hero=this.currentHero;const {score}=this.state;
    let h='';for(let i=0;i<this.QUESTIONS;i++){
      const filled=i<score;
      h+=`<span class="power-orb ${filled?'filled':''}"
        style="${filled?'background:'+hero.color+';border-color:'+hero.color:''}">
        ${filled?hero.powerEmoji:'○'}</span>`}
    meter.innerHTML=h;
  },

  // ===== RESULTS =====
  _showResults(){
    this.cleanup();const {score,questions}=this.state;const total=questions.length;
    const hero=this.currentHero;
    Adaptive.addStars(score);
    const newHeroId=Adaptive.unlockNextHero();
    const newHero=newHeroId?HEROES_DATA.find(h=>h.id===newHeroId):null;

    document.getElementById('results-overlay').style.display='flex';

    const pct=Math.round((score/total)*100);
    let title,emoji;
    if(pct>=90){title='!גיבור על אמיתי';emoji='🏆'}
    else if(pct>=70){title='!כל הכבוד';emoji='🌟'}
    else if(pct>=50){title='!יפה מאוד';emoji='👏'}
    else{title='!ניסיון טוב';emoji='💪'}

    document.getElementById('results-hero').innerHTML=
      `<img src="${hero.image}" alt="${hero.name_he}"
        onerror="this.outerHTML='<span style=\\'font-size:6rem\\'>${hero.emoji}</span>'">`;
    document.getElementById('results-title').textContent=emoji+' '+title;

    let starsHtml='';
    for(let i=0;i<total;i++){
      const earned=i<score;
      starsHtml+=`<span class="star ${earned?'':'empty'}" style="animation-delay:${i*0.15}s">⭐</span>`;
    }
    document.getElementById('results-stars').innerHTML=starsHtml;
    document.getElementById('results-score').textContent=`${score} מתוך ${total}`;

    const unlockEl=document.getElementById('results-unlock');
    if(newHero){
      unlockEl.innerHTML=`<div class="unlock-box">
        <div class="unlock-title">!גיבור חדש נפתח</div>
        <img src="${newHero.image}" alt="${newHero.name_he}"
          onerror="this.outerHTML='<span style=\\'font-size:5rem\\'>${newHero.emoji}</span>'">
        <div class="unlock-name">${newHero.name_he}</div></div>`;
    } else unlockEl.innerHTML='';

    if(pct>=70){Sounds.celebration();Particles.spawnConfetti(80)}
    else Sounds.correct();

    this._t(()=>{
      if(newHero) Speech.speakSequence([title.replace('!',''),`גיבור חדש נפתח! ${newHero.name_he}`],1000);
      else Speech.speak(title.replace('!',''));
    },500);
  },

  // ===== SPEECH HELPERS =====
  _speakPraise(isLevelUp){
    const hero=this.currentHero;
    if(isLevelUp){
      const phrase=HERO_LEVEL_UP[Math.floor(Math.random()*HERO_LEVEL_UP.length)];
      this._t(()=>Speech.speak(phrase.replace('!','')),300);
    } else {
      const pool=[...hero.phrases.correct,...HERO_PRAISE];
      const phrase=pool[Math.floor(Math.random()*pool.length)];
      this._t(()=>Speech.speak(phrase.replace('!','')),300);
    }
  },
  _speakEncourage(){
    const hero=this.currentHero;
    const pool=[...hero.phrases.wrong,...HERO_ENCOURAGE];
    const phrase=pool[Math.floor(Math.random()*pool.length)];
    this._t(()=>Speech.speak(phrase.replace('!','')),300);
  }
};

// ===== INIT ON LOAD =====
document.addEventListener('DOMContentLoaded',()=>{
  let inited=false;
  const initOnce=()=>{
    if(inited) return;inited=true;
    Speech.init();Sounds.init();
    document.removeEventListener('click',initOnce);
    document.removeEventListener('touchstart',initOnce);
  };
  document.addEventListener('click',initOnce);
  document.addEventListener('touchstart',initOnce);
  Game.init();
});

</script>
</body>
</html>
