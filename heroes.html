<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>גיבורי על - משחק חשבון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Russo+One&display=swap" rel="stylesheet">
<style>
/* ===== RESET & BASE ===== */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',Tahoma,sans-serif;
  background:#080820;color:#fff;touch-action:manipulation;user-select:none;-webkit-user-select:none}

/* ===== ANIMATED SPACE + HALFTONE BACKGROUND ===== */
body::before{content:'';position:fixed;top:0;left:0;width:200%;height:200%;
  background:radial-gradient(3px 3px at 20px 30px,#fff,transparent),
  radial-gradient(2px 2px at 40px 70px,rgba(255,255,200,0.9),transparent),
  radial-gradient(4px 4px at 90px 40px,#fff,transparent),
  radial-gradient(3px 3px at 130px 80px,rgba(200,200,255,1),transparent),
  radial-gradient(2px 2px at 160px 30px,#fff,transparent),
  radial-gradient(3px 3px at 50px 160px,rgba(255,200,200,0.9),transparent),
  radial-gradient(2px 2px at 100px 120px,#fff,transparent),
  radial-gradient(3px 3px at 180px 150px,rgba(200,255,200,0.8),transparent);
  background-size:200px 200px;animation:starsMove 80s linear infinite;z-index:0;pointer-events:none}
@keyframes starsMove{0%{transform:translate(0,0)}100%{transform:translate(-200px,-200px)}}

/* Comic halftone overlay - much stronger */
body::after{content:'';position:fixed;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(circle,rgba(255,255,255,0.12) 1px,transparent 1px);
  background-size:6px 6px;z-index:0;pointer-events:none}

/* Speed lines overlay */
.speed-lines-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(45deg,transparent,transparent 30px,rgba(255,255,255,0.03) 30px,rgba(255,255,255,0.03) 32px),
  repeating-linear-gradient(-30deg,transparent,transparent 40px,rgba(255,200,100,0.015) 40px,rgba(255,200,100,0.015) 42px);
  animation:speedLinesMove 8s linear infinite}
@keyframes speedLinesMove{0%{background-position:0 0}100%{background-position:60px 60px}}

/* ===== FULLSCREEN BUTTON ===== */
.fullscreen-btn{position:fixed;top:10px;left:10px;z-index:500;width:44px;height:44px;
  border-radius:12px;border:3px solid #000;background:linear-gradient(135deg,#FFD700,#FFA000);
  font-size:1.3rem;cursor:pointer;touch-action:manipulation;color:#000;font-weight:900;
  box-shadow:3px 3px 0 #000;transition:transform 0.15s;display:flex;align-items:center;justify-content:center}
.fullscreen-btn:active{transform:scale(0.9);box-shadow:1px 1px 0 #000}

/* ===== SCREENS ===== */
.screen{position:fixed;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;
  align-items:center;z-index:1;overflow-y:auto;overflow-x:hidden}
.screen.active{display:flex}

/* ===== CANVAS PARTICLES ===== */
#particles-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:100;pointer-events:none}

/* ===== ACTION WORD OVERLAY ===== */
#action-word{position:fixed;z-index:200;pointer-events:none;display:none;
  animation:actionPop 0.8s ease forwards}
#action-word.text-mode{font-family:'Bangers',cursive;font-size:6rem;color:#FFD700;
  -webkit-text-stroke:3px #000;paint-order:stroke fill;
  background:linear-gradient(135deg,#FF6347,#FFD700);-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(4px 4px 0 rgba(0,0,0,0.7));letter-spacing:2px}
#action-word img{width:220px;height:auto;max-height:180px;object-fit:contain;
  filter:drop-shadow(4px 4px 0 rgba(0,0,0,0.5))}
@keyframes actionPop{0%{transform:rotate(-15deg) scale(0);opacity:0}
  30%{transform:rotate(-10deg) scale(1.4);opacity:1}
  60%{transform:rotate(-12deg) scale(1.1);opacity:1}
  100%{transform:rotate(-12deg) scale(1.3);opacity:0}}

/* ===== COUNTDOWN OVERLAY ===== */
#countdown-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:300;
  display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.8);backdrop-filter:blur(8px)}
#countdown-number{font-family:'Bangers',cursive;font-size:14rem;font-weight:900;color:#FFD700;
  -webkit-text-stroke:4px #000;paint-order:stroke fill;
  text-shadow:0 0 40px rgba(255,215,0,0.8),0 0 80px rgba(255,100,0,0.4);
  animation:countZoom 0.7s ease}
@keyframes countZoom{0%{transform:scale(3);opacity:0}50%{transform:scale(0.9);opacity:1}100%{transform:scale(1);opacity:1}}

/* ===== SCREEN FLASH ===== */
#screen-flash{position:fixed;top:0;left:0;width:100%;height:100%;z-index:150;
  pointer-events:none;opacity:0;transition:opacity 0.1s}

/* ===== STREAK BANNER ===== */
.streak-banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:250;
  display:none;font-family:'Bangers',cursive;font-size:3rem;color:#FFD700;text-align:center;
  -webkit-text-stroke:2px #000;paint-order:stroke fill;
  text-shadow:0 0 20px rgba(255,215,0,0.8);
  animation:streakPop 1.2s ease forwards;white-space:nowrap}
@keyframes streakPop{0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg);opacity:0}
  30%{transform:translate(-50%,-50%) scale(1.3) rotate(5deg);opacity:1}
  60%{transform:translate(-50%,-50%) scale(1.1) rotate(-2deg);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1.2) rotate(0deg);opacity:0}}

/* ===== COMIC RAY BURST ===== */
.ray-burst{position:absolute;top:50%;left:50%;width:400px;height:400px;transform:translate(-50%,-50%);
  background:conic-gradient(from 0deg,transparent 0deg,rgba(255,215,0,0.06) 10deg,transparent 20deg,
  rgba(226,54,54,0.04) 30deg,transparent 40deg,rgba(255,215,0,0.06) 50deg,transparent 60deg);
  border-radius:50%;animation:rayRotate 20s linear infinite;pointer-events:none;z-index:0}
@keyframes rayRotate{0%{transform:translate(-50%,-50%) rotate(0deg)}100%{transform:translate(-50%,-50%) rotate(360deg)}}

/* ===== MENU SCREEN ===== */
#menu-screen{padding:10px 16px;gap:8px;position:relative}

.menu-title{font-family:'Bangers',cursive;font-size:4rem;text-align:center;margin-top:8px;
  color:#FFD700;-webkit-text-stroke:4px #000;paint-order:stroke fill;
  text-shadow:4px 4px 0 #C62828,6px 6px 0 #8B0000,8px 8px 0 rgba(0,0,0,0.4);
  letter-spacing:4px;animation:titlePulse 3s ease-in-out infinite;position:relative;z-index:1}
@keyframes titlePulse{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.06) rotate(-1deg)}}

.menu-subtitle{font-family:'Bangers',cursive;font-size:1.5rem;color:#fff;text-align:center;
  -webkit-text-stroke:1.5px rgba(0,0,0,0.6);letter-spacing:6px;
  text-shadow:2px 2px 0 #E23636,3px 3px 0 rgba(0,0,0,0.5);margin:0 0 4px;position:relative;z-index:1}

/* Star Counter - Comic Shield Badge */
.star-counter{font-family:'Bangers',cursive;font-size:1.8rem;color:#FFD700;
  display:flex;align-items:center;gap:8px;padding:10px 24px;
  background:linear-gradient(135deg,#1a1a4e,#0D47A1);border:4px solid #000;border-radius:30px;
  box-shadow:4px 4px 0 #000,inset 0 0 10px rgba(255,215,0,0.15);letter-spacing:2px;position:relative;z-index:1}

/* Mode Buttons - Comic Style */
.mode-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:480px;padding:0 12px;
  position:relative;z-index:1}
.mode-btn{display:flex;align-items:center;gap:10px;padding:14px 14px;border:5px solid #000;border-radius:16px;
  cursor:pointer;touch-action:manipulation;font-size:1.2rem;font-weight:800;color:#fff;
  position:relative;overflow:hidden;transition:transform 0.15s,box-shadow 0.15s;
  box-shadow:6px 6px 0 #000;transform:skewX(-3deg);font-family:'Bangers',cursive;letter-spacing:1px}
.mode-btn:active{transform:skewX(-3deg) scale(0.94);box-shadow:2px 2px 0 #000}
.mode-btn-icon{font-size:2rem;filter:drop-shadow(0 3px 6px rgba(0,0,0,0.5))}
.mode-btn-text{display:flex;flex-direction:column;text-align:right}
.mode-btn-title{font-size:1.2rem}
.mode-btn-desc{font-size:0.7rem;font-weight:400;opacity:0.8;font-family:'Segoe UI',sans-serif;
  -webkit-text-stroke:0;letter-spacing:0}
.mode-btn-counting{background:linear-gradient(135deg,#9C27B0,#4A148C)}
.mode-btn-mission{background:linear-gradient(135deg,#E23636,#B71C1C)}
.mode-btn-battle{background:linear-gradient(135deg,#FF6F00,#E65100)}
.mode-btn-puzzle{background:linear-gradient(135deg,#1565C0,#0D47A1)}
.mode-btn-memory{background:linear-gradient(135deg,#00897B,#004D40)}
.mode-btn-order{background:linear-gradient(135deg,#C62828,#6A1B9A)}
.mode-btn::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:repeating-linear-gradient(45deg,transparent,transparent 4px,rgba(255,255,255,0.04) 4px,rgba(255,255,255,0.04) 6px);
  pointer-events:none}
.mode-btn::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);
  animation:btnShine 4s ease-in-out infinite}
@keyframes btnShine{0%,100%{left:-100%}50%{left:120%}}

/* Hero Collection */
.collection-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;padding:6px 12px;
  max-width:560px;position:relative;z-index:1}
.collection-badge{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:3px solid #000;box-shadow:2px 2px 0 rgba(0,0,0,0.5);transition:transform 0.2s;position:relative}
.collection-badge.unlocked{animation:badgePulse 3s ease-in-out infinite}
.collection-badge.locked{filter:grayscale(0.8);opacity:0.45}
.collection-badge.locked::after{content:'🔒';position:absolute;font-size:0.7rem;
  bottom:-2px;right:-2px;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.8))}
.collection-badge img{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:center top}
@keyframes badgePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* ===== GAME SCREEN ===== */
.game-screen{padding:8px 12px;gap:6px;position:relative}
.game-screen::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(circle,rgba(255,255,255,0.04) 1px,transparent 1px);
  background-size:6px 6px;pointer-events:none;z-index:0}

.game-header{width:100%;display:flex;justify-content:space-between;align-items:center;padding:0 4px;
  position:relative;z-index:2}
.back-btn{width:48px;height:48px;border-radius:12px;border:3px solid #000;
  background:linear-gradient(135deg,#FFD700,#FFA000);font-size:1.5rem;cursor:pointer;
  touch-action:manipulation;color:#000;display:flex;align-items:center;justify-content:center;
  box-shadow:3px 3px 0 #000;transition:transform 0.15s;font-weight:900}
.back-btn:active{transform:scale(0.9);box-shadow:1px 1px 0 #000}
.progress-text{font-family:'Bangers',cursive;font-size:1.3rem;color:#fff;
  -webkit-text-stroke:1px rgba(0,0,0,0.5);letter-spacing:2px;
  text-shadow:2px 2px 0 rgba(0,0,0,0.4);position:relative;z-index:2}

/* Power Meter */
.power-meter{display:flex;gap:8px;justify-content:center;padding:6px 0;position:relative;z-index:2}
.power-orb{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,0.3);
  background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;
  font-size:1rem;color:rgba(255,255,255,0.4);transition:all 0.4s ease}
.power-orb.filled{border-color:#000;transform:scale(1.15);
  animation:orbFillBig 0.6s ease;font-size:1.1rem;
  box-shadow:0 0 15px rgba(255,215,0,0.5),3px 3px 0 rgba(0,0,0,0.4)}
@keyframes orbFillBig{0%{transform:scale(0.3);opacity:0}50%{transform:scale(1.4)}100%{transform:scale(1.15);opacity:1}}

/* Hero Display */
.hero-area{display:flex;align-items:center;justify-content:center;min-height:120px;
  transition:transform 0.3s ease;position:relative;z-index:2}
.hero-area::before{content:'';position:absolute;width:260px;height:260px;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0deg,rgba(255,215,0,0.12) 10deg,transparent 20deg,
  rgba(255,100,0,0.08) 30deg,transparent 40deg,rgba(100,200,255,0.06) 50deg,transparent 60deg);
  animation:rayRotate 12s linear infinite;pointer-events:none}
.hero-area img{width:170px;height:170px;border-radius:50%;object-fit:cover;object-position:center top;
  border:6px solid #000;box-shadow:0 0 0 4px #FFD700,0 0 25px rgba(255,215,0,0.4),8px 8px 0 rgba(0,0,0,0.5);
  transition:all 0.3s ease}
.hero-area.celebrate img{animation:heroCelebrateNew 1s ease;
  box-shadow:0 0 0 4px #FFD700,0 0 50px rgba(255,215,0,0.9),0 0 80px rgba(255,100,0,0.4)}
.hero-area.sad img{animation:heroSadNew 0.6s ease}
@keyframes heroCelebrateNew{0%{transform:scale(1)}20%{transform:scale(1.4) rotate(-8deg)}
  40%{transform:scale(1.5) rotate(8deg)}60%{transform:scale(1.3) rotate(-4deg)}
  80%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes heroSadNew{0%,100%{transform:translateY(0)}20%{transform:translateY(-10px)}
  40%{transform:translateY(6px)}60%{transform:translateY(-4px)}80%{transform:translateY(2px)}}

/* Question Area - Speech Bubble */
.question-area{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:520px;
  position:relative;z-index:2}
.speech-bubble{position:relative;background:rgba(255,255,255,0.18);border:4px solid #000;
  border-radius:24px;padding:16px 24px;backdrop-filter:blur(8px);
  box-shadow:5px 5px 0 rgba(0,0,0,0.4),inset 0 0 20px rgba(255,255,255,0.08)}
.speech-bubble::after{content:'';position:absolute;top:-16px;left:50%;transform:translateX(-50%);
  border:10px solid transparent;border-bottom-color:#000}
.speech-bubble::before{content:'';position:absolute;top:-12px;left:50%;transform:translateX(-50%);
  border:8px solid transparent;border-bottom-color:rgba(255,255,255,0.15);z-index:1}
.prompt-text{font-family:'Bangers',cursive;font-size:2.3rem;color:#fff;text-align:center;
  -webkit-text-stroke:1.5px rgba(0,0,0,0.5);paint-order:stroke fill;
  letter-spacing:3px;text-shadow:2px 2px 0 rgba(0,0,0,0.4),0 0 15px rgba(255,215,0,0.3)}

/* Counting Items */
.count-items{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:16px;
  background:rgba(0,0,0,0.35);border-radius:20px;border:4px solid rgba(255,255,255,0.25);
  min-height:60px;max-width:380px;box-shadow:inset 0 0 20px rgba(0,0,0,0.3)}
.count-item{font-size:2.6rem;animation:itemBounceIn 0.4s ease both;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,0.5))}
@keyframes itemBounceIn{0%{transform:scale(0) rotate(-180deg);opacity:0}
  60%{transform:scale(1.3) rotate(15deg)}80%{transform:scale(0.9) rotate(-5deg)}
  100%{transform:scale(1) rotate(0deg);opacity:1}}

/* Equation Display */
.equation{display:flex;align-items:center;justify-content:center;gap:14px;padding:16px 26px;
  background:rgba(0,0,0,0.4);border-radius:20px;border:5px solid #000;
  box-shadow:6px 6px 0 rgba(0,0,0,0.5),inset 0 0 15px rgba(0,0,0,0.2);
  direction:ltr}
.eq-num{font-family:'Russo One',sans-serif;font-size:4rem;font-weight:900;color:#fff;
  -webkit-text-stroke:2px #000;paint-order:stroke fill;
  text-shadow:3px 3px 0 rgba(0,0,0,0.4);min-width:55px;text-align:center}
.eq-op{font-family:'Bangers',cursive;font-size:2.5rem}
.eq-op.add{color:#69F0AE;-webkit-text-stroke:1px #000}
.eq-op.sub{color:#FF8A80;-webkit-text-stroke:1px #000}
.eq-op.eq{color:#fff;-webkit-text-stroke:1px #000}
.eq-mystery{font-size:4.5rem;color:#FFD700;animation:mysteryGlow 1.5s ease-in-out infinite}
@keyframes mysteryGlow{0%,100%{text-shadow:3px 3px 0 rgba(0,0,0,0.4)}
  50%{text-shadow:0 0 30px rgba(255,215,0,0.8),3px 3px 0 rgba(0,0,0,0.4)}}

/* Item Groups */
.eq-items{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  position:relative;z-index:2;direction:ltr}
.item-group{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;padding:8px 12px;
  background:rgba(255,255,255,0.08);border-radius:14px;max-width:170px;border:2px solid rgba(255,255,255,0.1)}
.small-item{font-size:1.2rem}
.big-num{font-family:'Russo One',sans-serif;font-size:2.2rem;color:#fff;margin-left:6px;
  -webkit-text-stroke:1px #000}
.eq-op-big{font-family:'Bangers',cursive;font-size:2.2rem}
.eq-op-big.add{color:#69F0AE;-webkit-text-stroke:1px #000}
.eq-op-big.sub{color:#FF8A80;-webkit-text-stroke:1px #000}

/* Answer Buttons - Comic 3D */
.answers{display:flex;gap:14px;justify-content:center;padding:10px 0;width:100%;max-width:420px;
  position:relative;z-index:2}
.answer-btn{flex:1;min-width:95px;min-height:108px;max-width:140px;border-radius:20px;
  border:6px solid #000;background:linear-gradient(180deg,#fff,#e0e0ee);
  font-family:'Russo One',sans-serif;font-size:3.6rem;font-weight:900;color:#222;
  cursor:pointer;touch-action:manipulation;transition:all 0.12s ease;
  box-shadow:8px 8px 0 #000;position:relative;-webkit-text-stroke:1px rgba(0,0,0,0.15)}
.answer-btn::before{content:'';position:absolute;top:0;left:0;width:100%;height:50%;
  background:linear-gradient(180deg,rgba(255,255,255,0.4),transparent);border-radius:14px 14px 0 0;pointer-events:none}
.answer-btn:active:not(.disabled):not(.correct):not(.wrong){
  transform:translateY(6px);box-shadow:2px 2px 0 #000}
.answer-btn.correct{background:linear-gradient(135deg,#43A047,#66BB6A);border-color:#1B5E20;color:#fff;
  transform:scale(1.15) translateY(-6px);
  box-shadow:0 0 40px rgba(76,175,80,0.8),0 0 80px rgba(76,175,80,0.3),8px 8px 0 #000;
  animation:correctPop 0.7s ease;-webkit-text-stroke:2px #000}
@keyframes correctPop{0%{transform:scale(1)}20%{transform:scale(1.3) rotate(-6deg)}
  40%{transform:scale(1.05) rotate(4deg)}60%{transform:scale(1.2) rotate(-2deg)}
  80%{transform:scale(1.12)}100%{transform:scale(1.15)}}
.answer-btn.wrong{background:linear-gradient(135deg,#FF9800,#FFB74D);border-color:#E65100;
  color:#fff;animation:shake 0.6s ease;-webkit-text-stroke:2px #000}
@keyframes shake{0%,100%{transform:translateX(0)}10%{transform:translateX(-10px) rotate(-3deg)}
  20%{transform:translateX(10px) rotate(3deg)}30%{transform:translateX(-8px) rotate(-2deg)}
  40%{transform:translateX(8px) rotate(2deg)}50%{transform:translateX(-6px)}
  60%{transform:translateX(6px)}70%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.answer-btn.disabled{opacity:0.3;pointer-events:none}

/* Battle Mode */
.battle-area{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px;
  width:100%;max-width:520px;position:relative;z-index:2}
.battle-card{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 14px;
  border:6px solid #000;border-radius:20px;background:linear-gradient(180deg,#fff,#eee);
  cursor:pointer;touch-action:manipulation;transition:all 0.2s ease;
  box-shadow:7px 7px 0 #000;max-width:210px;position:relative;transform:rotate(-3deg)}
.battle-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;border-radius:14px;
  background:repeating-linear-gradient(45deg,transparent,transparent 5px,rgba(0,0,0,0.02) 5px,rgba(0,0,0,0.02) 7px);
  pointer-events:none}
.battle-card:nth-child(3){transform:rotate(3deg)}
.battle-card:active:not(.winner):not(.loser){transform:scale(0.95) rotate(0deg);box-shadow:2px 2px 0 #000}
.battle-card img{width:105px;height:105px;border-radius:50%;object-fit:cover;object-position:center top;
  border:4px solid #000;box-shadow:0 0 0 3px #FFD700}
.battle-num{font-family:'Russo One',sans-serif;font-size:3.8rem;
  -webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:3px 3px 0 rgba(0,0,0,0.15)}
.battle-name{font-family:'Bangers',cursive;font-size:1rem;color:#333;letter-spacing:1px}
.vs-text{font-family:'Bangers',cursive;font-size:3rem;color:#FFD700;
  -webkit-text-stroke:3px #000;paint-order:stroke fill;
  text-shadow:3px 3px 0 #C62828,5px 5px 0 rgba(0,0,0,0.5);animation:vsBounce 1.2s ease-in-out infinite;
  position:relative;z-index:1}
.vs-text::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);

/* Results Overlay */
.results-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:50;

/* Speed lines behind results */
.results-overlay::before{content:'';position:absolute;top:50%;left:50%;width:600px;height:600px;

  rgba(226,54,54,0.03) 15deg,transparent 20deg);

.results-hero{text-align:center;margin-bottom:8px;position:relative;z-index:1}
.results-hero img{width:160px;height:160px;border-radius:50%;object-fit:cover;object-position:center top;

  animation:resultsHeroIn 0.8s ease}
@keyframes resultsHeroIn{0%{transform:scale(0) rotate(-30deg);opacity:0}
  60%{transform:scale(1.2) rotate(5deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.results-title{font-family:'Bangers',cursive;font-size:3.4rem;text-align:center;
  color:#FFD700;-webkit-text-stroke:3px #000;paint-order:stroke fill;
  text-shadow:3px 3px 0 #C62828,5px 5px 0 rgba(0,0,0,0.4);letter-spacing:3px;

@keyframes titleGlowResult{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.results-stars{font-size:2.6rem;text-align:center;padding:10px 0;position:relative;z-index:1}
.results-stars .star{display:inline-block;opacity:0;animation:starAppear 0.4s ease forwards}

.results-stars .star.empty{filter:grayscale(1);opacity:0.3}
.results-score{font-family:'Bangers',cursive;font-size:1.6rem;color:rgba(255,255,255,0.8);

/* Unlock Box */

/* ===== PUZZLE MODE ===== */
.puzzle-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:360px;
  position:relative;z-index:2;direction:ltr}
.puzzle-piece{aspect-ratio:1;border:4px solid #000;border-radius:4px;cursor:pointer;
  touch-action:manipulation;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#1a1a4e,#0D47A1);box-shadow:3px 3px 0 #000;
  transition:all 0.4s ease;display:flex;align-items:center;justify-content:center}
.puzzle-piece.revealed{cursor:default;border-color:#FFD700;
  box-shadow:0 0 15px rgba(255,215,0,0.4),4px 4px 0 #000}
.puzzle-piece.revealed .puzzle-img{opacity:1;transform:scale(1)}
.puzzle-piece .puzzle-img{width:100%;height:100%;opacity:0;
  transform:scale(0.5);transition:all 0.5s ease;position:absolute;top:0;left:0;
  border-radius:2px}
.puzzle-piece.active{border-color:#FFD700;animation:puzzleGlow 1s ease-in-out infinite}
@keyframes puzzleGlow{0%,100%{box-shadow:0 0 10px rgba(255,215,0,0.3),4px 4px 0 #000}
  50%{box-shadow:0 0 25px rgba(255,215,0,0.7),4px 4px 0 #000}}
.puzzle-piece .puzzle-num{font-family:'Bangers',cursive;font-size:1.8rem;color:rgba(255,255,255,0.3);
  position:absolute}
.puzzle-piece.unrevealed::before{content:'?';font-family:'Bangers',cursive;font-size:2.5rem;
  color:rgba(255,215,0,0.4);position:absolute}

/* ===== MEMORY CARD GAME ===== */
.memory-grid{display:grid;gap:10px;width:100%;max-width:420px;position:relative;z-index:2}
.memory-grid.pairs-6{grid-template-columns:repeat(4,1fr)}
.memory-grid.pairs-8{grid-template-columns:repeat(4,1fr)}
.memory-card{aspect-ratio:0.8;perspective:800px;cursor:pointer;touch-action:manipulation}
.memory-card-inner{position:relative;width:100%;height:100%;transition:transform 0.5s;
  transform-style:preserve-3d}
.memory-card.flipped .memory-card-inner,.memory-card.matched .memory-card-inner{transform:rotateY(180deg)}
.memory-card-face,.memory-card-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;
  border:4px solid #000;border-radius:12px;display:flex;align-items:center;justify-content:center;
  box-shadow:4px 4px 0 #000}
.memory-card-back{background:linear-gradient(135deg,#E23636,#B71C1C);
  background-image:url('images/comics/burst-yellow.png');background-size:80%;background-position:center;background-repeat:no-repeat;
  background-color:#E23636}
.memory-card-back::after{content:'';position:absolute;width:100%;height:100%;border-radius:8px;
  background:repeating-linear-gradient(45deg,transparent,transparent 3px,rgba(0,0,0,0.05) 3px,rgba(0,0,0,0.05) 5px)}
.memory-card-face{background:linear-gradient(180deg,#fff,#e8e8f0);transform:rotateY(180deg);
  flex-direction:column;padding:4px}
.memory-card-face .card-text{font-family:'Russo One',sans-serif;font-size:1.4rem;font-weight:900;
  color:#222;-webkit-text-stroke:0.5px rgba(0,0,0,0.2);text-align:center;line-height:1.2;
  direction:ltr;unicode-bidi:bidi-override}
.memory-card-face .card-text.card-answer{font-size:2rem;color:#E23636}
.memory-card.matched .memory-card-face{border-color:#FFD700;
  box-shadow:0 0 15px rgba(255,215,0,0.5),4px 4px 0 #000}
.memory-card.matched{pointer-events:none}
.memory-attempts{font-family:'Bangers',cursive;font-size:1.3rem;color:#FFD700;
  -webkit-text-stroke:1px #000;letter-spacing:2px;position:relative;z-index:2}

/* ===== LINEUP / ORDINALITY GAME ===== */
.lineup-area{display:flex;align-items:flex-end;justify-content:center;gap:6px;padding:10px;
  width:100%;max-width:500px;overflow-x:auto;position:relative;z-index:2;
  -webkit-overflow-scrolling:touch}
.lineup-hero{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  touch-action:manipulation;transition:all 0.3s ease;flex-shrink:0}
.lineup-hero img{width:85px;height:85px;border-radius:50%;object-fit:cover;object-position:center top;
  border:4px solid #000;box-shadow:0 0 0 3px #FFD700;transition:all 0.3s}
.lineup-hero .lineup-platform{width:85px;height:36px;background:linear-gradient(180deg,#FFD700,#FFA000);
  border:3px solid #000;border-radius:6px 6px 0 0;display:flex;align-items:center;justify-content:center;

.lineup-hero.highlighted img{box-shadow:0 0 0 3px #FFD700,0 0 20px rgba(255,215,0,0.8);

.lineup-hero.correct-pick img{box-shadow:0 0 0 3px #4CAF50,0 0 25px rgba(76,175,80,0.8);border-color:#1B5E20}
.lineup-hero.wrong-pick img{box-shadow:0 0 0 3px #FF5722,0 0 15px rgba(255,87,34,0.6);border-color:#BF360C;

@keyframes lineupPulse{0%,100%{transform:scale(1.15) translateY(0)}50%{transform:scale(1.15) translateY(-5px)}}
.ordinal-buttons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:8px 0;
  width:100%;max-width:400px;position:relative;z-index:2}
.ordinal-btn{padding:10px 16px;border:4px solid #000;border-radius:12px;
  font-family:'Bangers',cursive;font-size:1.1rem;color:#fff;cursor:pointer;
  touch-action:manipulation;box-shadow:4px 4px 0 #000;transition:all 0.15s;
  background:linear-gradient(135deg,#1976D2,#0D47A1)}
.ordinal-btn:active{transform:scale(0.95);box-shadow:2px 2px 0 #000}
.ordinal-btn.correct{background:linear-gradient(135deg,#4CAF50,#2E7D32);border-color:#1B5E20}
.ordinal-btn.wrong{background:linear-gradient(135deg,#FF9800,#E65100);border-color:#BF360C;animation:shake 0.5s ease}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms !important;transition-duration:0.01ms !important}}

/* ===== TEAM CARDS - COMIC PANEL LAYOUT ===== */
.teams-section{width:100%;max-width:100%;padding:0 12px;position:relative;z-index:1}
.teams-title{font-family:'Bangers',cursive;font-size:1.8rem;color:#FFD700;text-align:center;
  -webkit-text-stroke:1.5px #000;paint-order:stroke fill;letter-spacing:2px;margin-bottom:8px;
  text-shadow:2px 2px 0 rgba(0,0,0,0.4)}
.teams-grid{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;

.teams-grid::-webkit-scrollbar{display:none}
.team-card{position:relative;border:4px solid #000;border-radius:14px;overflow:hidden;

  min-height:125px;min-width:150px;flex-shrink:0;display:flex;flex-direction:column;scroll-snap-align:start}

/* Team card header with inline SVG logo */
.team-card-header{display:flex;align-items:center;justify-content:center;gap:8px;
  padding:8px 10px;position:relative;z-index:2}
.team-card-header svg{width:32px;height:32px;flex-shrink:0;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4));transition:transform 0.3s}
.team-card:hover .team-card-header svg{transform:scale(1.15) rotate(5deg)}
.team-card-name{font-family:'Bangers',cursive;font-size:1.35rem;color:#fff;

  text-shadow:2px 2px 0 rgba(0,0,0,0.5)}

/* Comic-panel halftone overlay on team cards */
.team-card::after{content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(circle,rgba(0,0,0,0.08) 1px,transparent 1px);
  background-size:4px 4px;pointer-events:none;z-index:1}

/* Team members row */
.team-members{display:flex;justify-content:center;gap:4px;padding:6px 8px;flex-wrap:wrap;position:relative;z-index:2}
.team-member{width:50px;height:50px;border-radius:50%;object-fit:cover;object-position:center top;
  border:3px solid #000;box-shadow:0 0 0 2px #FFD700;transition:transform 0.3s}
.team-member:hover{transform:scale(1.15)}
.team-member.locked-member{filter:grayscale(0.9);opacity:0.4;box-shadow:0 0 0 2px #555}

/* Team-specific colors */
.team-avengers{background:linear-gradient(135deg,#1565C0,#0D47A1)}
.team-xmen{background:linear-gradient(135deg,#F9A825,#E65100)}
.team-villains{background:linear-gradient(135deg,#4A148C,#1a0033)}
.team-cosmic{background:linear-gradient(135deg,#00695C,#004D40)}
.team-marvel{background:linear-gradient(180deg,#E23636,#B71C1C)}

/* Team complete glow */
.team-card.team-complete{box-shadow:4px 4px 0 rgba(0,0,0,0.5),0 0 15px rgba(255,215,0,0.3)}
.team-card.team-complete .comic-corner{border-top-color:rgba(255,215,0,0.7)}

/* Comic speed lines on team cards */
.team-card .speed-lines{position:absolute;top:0;left:0;width:100%;height:100%;
  background:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(255,255,255,0.05) 6px,rgba(255,255,255,0.05) 8px);
  pointer-events:none;z-index:0;animation:teamSpeedLines 10s linear infinite}
@keyframes teamSpeedLines{0%{background-position:0 0}100%{background-position:40px 40px}}

/* Marvel banner logo */
.marvel-banner{width:100%;max-width:520px;padding:6px 12px;position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;gap:10px}
.marvel-banner svg{height:36px;width:auto;filter:drop-shadow(0 2px 6px rgba(244,67,54,0.5));
  animation:marvelGlow 3s ease-in-out infinite}
@keyframes marvelGlow{0%,100%{filter:drop-shadow(0 2px 6px rgba(244,67,54,0.5))}
  50%{filter:drop-shadow(0 2px 12px rgba(244,67,54,0.8))}}
.marvel-banner-line{flex:1;height:3px;background:linear-gradient(90deg,transparent,#E23636,transparent);border-radius:2px}

.deco-float:nth-child(2n){animation-duration:16s;animation-delay:-4s}

.puzzle-grid::before{content:'';position:absolute;top:-8px;left:-8px;right:-8px;bottom:-8px;

  40%{transform:translate(-50%,-50%) scale(1.3) rotate(5deg);opacity:1}
  70%{transform:translate(-50%,-50%) scale(1.1) rotate(-2deg);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1.2) rotate(0deg);opacity:0}}

/* ===== RESULTS SPARKLE OVERLAY ===== */
.results-sparkle{position:absolute;top:0;left:0;width:100%;height:100%;

.vs-splat{position:absolute;width:120px;height:120px;top:50%;left:50%;

  animation:vsSplatPulse 2s ease-in-out infinite}
@keyframes vsSplatPulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.3}
  50%{transform:translate(-50%,-50%) scale(1.15);opacity:0.5}}

/* ===== ENHANCED MEMORY CARD BACKS ===== */
.memory-card-back{background:linear-gradient(135deg,#E23636 0%,#B71C1C 40%,#7F0000 100%);
  background-image:url('images/comics/burst-yellow.png');background-size:70%;
  background-position:center;background-repeat:no-repeat}

/* ===== ENHANCED CORRECT/WRONG EFFECTS ===== */
.hero-area.celebrate::after{content:'';position:absolute;width:300px;height:300px;
  background:url('images/heroes/pngwing.com (3).png') center/contain no-repeat;
  pointer-events:none;opacity:0.3;animation:sparkleFlash 1s ease forwards}
@keyframes sparkleFlash{0%{transform:scale(0.5);opacity:0}30%{transform:scale(1.2);opacity:0.4}
  100%{transform:scale(1.5);opacity:0}}

function toggleFullscreen(){
  if(!document.fullscreenElement&&!document.webkitFullscreenElement){
    const el=document.documentElement;
    if(el.requestFullscreen) el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } else {
    if(document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
}

// ===== SPEECH MODULE =====
const Speech = {
  _voice:null,_ready:false,_useFallback:false,_initPromise:null,_fallbackAudio:null,
  _sequenceTimeouts:[],_isSpeaking:false,
  init(){
    if(this._initPromise) return this._initPromise;
    this._initPromise = new Promise(resolve=>{
      if(!window.speechSynthesis){this._useFallback=true;this._ready=true;resolve(true);return}
      const findVoice=()=>{
        const voices=speechSynthesis.getVoices();
        this._voice=voices.find(v=>/he[-_]IL/i.test(v.lang))||voices.find(v=>/^he/i.test(v.lang));
        if(this._voice){this._ready=true;this._useFallback=false;resolve(true);return true}
        return false};
      if(findVoice()) return;
      const onVC=()=>{if(findVoice()) speechSynthesis.removeEventListener('voiceschanged',onVC)};
      speechSynthesis.addEventListener('voiceschanged',onVC);
      let att=0;const iv=setInterval(()=>{att++;
        if(findVoice()||att>15){clearInterval(iv);speechSynthesis.removeEventListener('voiceschanged',onVC);
          if(!this._ready){this._useFallback=true;this._ready=true;resolve(true)}}},200)});
    return this._initPromise},
  speak(text){if(!this._ready||!text) return;this._clearSequence();
    if(this._useFallback) this._speakFallback(text);else this._speakNative(text)},
  speakSequence(segments,pauseMs){if(!this._ready||!segments||segments.length===0) return;
    pauseMs=pauseMs||800;this.stop();
    if(this._useFallback) this._speakFallbackSequence(segments,pauseMs);
    else this._speakNativeSequence(segments,pauseMs)},
  _speakNative(text){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);
    u.voice=this._voice;u.lang='he-IL';u.rate=0.75;u.pitch=1.05;
    // Watchdog: if speech gets stuck for 8s, cancel and retry once
    let watchdog=setTimeout(()=>{if(speechSynthesis.speaking){speechSynthesis.cancel();
      const retry=new SpeechSynthesisUtterance(text);retry.voice=this._voice;retry.lang='he-IL';
      retry.rate=0.75;retry.pitch=1.05;speechSynthesis.speak(retry)}},8000);
    u.onend=()=>clearTimeout(watchdog);u.onerror=()=>clearTimeout(watchdog);
    speechSynthesis.speak(u)},
  _speakNativeSequence(segments,pauseMs){this._isSpeaking=true;let idx=0;
    const next=()=>{if(!this._isSpeaking||idx>=segments.length){this._isSpeaking=false;return}
      const text=segments[idx];idx++;if(!text){next();return}
      const u=new SpeechSynthesisUtterance(text);u.voice=this._voice;u.lang='he-IL';u.rate=0.75;u.pitch=1.05;
      u.onend=()=>{if(idx<segments.length&&this._isSpeaking){const t=setTimeout(next,pauseMs);this._sequenceTimeouts.push(t)}else this._isSpeaking=false};
      u.onerror=()=>{if(this._isSpeaking){const t=setTimeout(next,pauseMs);this._sequenceTimeouts.push(t)}};
      speechSynthesis.speak(u)};next()},
  _speakFallback(text){this._stopFallbackAudio();try{const chunks=this._chunkText(text,180);
    if(chunks.length===1) this._playFallbackChunk(chunks[0]);
    else this._speakFallbackSequence(chunks,300)}catch(e){}},
  _speakFallbackSequence(segments,pauseMs){this._isSpeaking=true;let idx=0;
    const playNext=()=>{if(!this._isSpeaking||idx>=segments.length){this._isSpeaking=false;return}
      const text=segments[idx];idx++;if(!text){playNext();return}
      const chunks=this._chunkText(text,180);let ci=0;
      const playChunk=()=>{if(!this._isSpeaking||ci>=chunks.length){
        if(idx<segments.length&&this._isSpeaking){const t=setTimeout(playNext,pauseMs);this._sequenceTimeouts.push(t)}
        else this._isSpeaking=false;return}
        this._playFallbackChunk(chunks[ci],()=>{ci++;
          if(ci<chunks.length){const t=setTimeout(playChunk,200);this._sequenceTimeouts.push(t)}
          else playChunk()})};playChunk()};playNext()},
  _playFallbackChunk(text,onEnd){try{const enc=encodeURIComponent(text);
    const url='https://translate.google.com/translate_tts?ie=UTF-8&tl=iw&client=tw-ob&q='+enc;
    this._fallbackAudio=new Audio(url);this._fallbackAudio.playbackRate=0.75;
    if(onEnd){this._fallbackAudio.addEventListener('ended',onEnd,{once:true});
      this._fallbackAudio.addEventListener('error',onEnd,{once:true})}
    this._fallbackAudio.play().catch(()=>{if(onEnd) onEnd()})}catch(e){if(onEnd) onEnd()}},
  _chunkText(text,maxLen){const enc=encodeURIComponent(text);if(enc.length<=maxLen) return [text];
    const words=text.split(' ');const chunks=[];let cur='';
    for(let i=0;i<words.length;i++){const cand=cur?cur+' '+words[i]:words[i];
      if(encodeURIComponent(cand).length>maxLen&&cur){chunks.push(cur);cur=words[i]}else cur=cand}
    if(cur) chunks.push(cur);return chunks},
  _clearSequence(){this._isSpeaking=false;this._sequenceTimeouts.forEach(t=>clearTimeout(t));this._sequenceTimeouts=[]},
  _stopFallbackAudio(){if(this._fallbackAudio){this._fallbackAudio.pause();this._fallbackAudio.currentTime=0;this._fallbackAudio=null}},
  stop(){this._clearSequence();if(window.speechSynthesis) speechSynthesis.cancel();this._stopFallbackAudio()}
};

     {freq:1047,s:0.65,d:0.35},{freq:1319,s:1.05,d:0.5},{freq:1568,s:1.1,d:0.5}].forEach(nt=>{

// ===== ADAPTIVE DIFFICULTY ENGINE (STARTS BELOW 10!) =====
const Adaptive = {
  _defaultSkill(){return {level:1,streak:0,wrongStreak:0,totalCorrect:0,totalWrong:0}},
  _state:null,
  getState(){
    if(!this._state){this._state=Storage.getHeroMathAdaptive()||{
      counting:this._defaultSkill(),addition:this._defaultSkill(),
      subtraction:this._defaultSkill(),comparison:this._defaultSkill(),
      puzzle:this._defaultSkill(),memory:this._defaultSkill(),
      cardinality:this._defaultSkill(),ordinality:this._defaultSkill(),
      heroesUnlocked:['spiderman'],totalStars:0,roundsCompleted:0}}
    // migrate old saves
    if(!this._state.puzzle) this._state.puzzle=this._defaultSkill();
    if(!this._state.memory) this._state.memory=this._defaultSkill();
    if(!this._state.cardinality) this._state.cardinality=this._defaultSkill();
    if(!this._state.ordinality) this._state.ordinality=this._defaultSkill();
    return this._state},
  save(){Storage.saveHeroMathAdaptive(this._state)},
  recordCorrect(skill){const s=this.getState()[skill];if(!s) return;
    s.streak++;s.wrongStreak=0;s.totalCorrect++;
    if(s.streak>=3&&s.level<5){s.level++;s.streak=0;this.save();return 'level_up'}
    this.save();return 'correct'},
  recordWrong(skill){const s=this.getState()[skill];if(!s) return;
    s.streak=0;s.wrongStreak++;s.totalWrong++;
    if(s.wrongStreak>=2&&s.level>1){s.level--;s.wrongStreak=0;this.save();return 'level_down'}
    this.save();return 'wrong'},
  getLevel(skill){return this.getState()[skill]?.level||1},
  unlockNextHero(){const st=this.getState();st.roundsCompleted++;
    if(st.roundsCompleted%2===0){const allIds=HEROES_DATA.map(h=>h.id);
      const locked=allIds.filter(id=>!st.heroesUnlocked.includes(id));
      if(locked.length>0){st.heroesUnlocked.push(locked[0]);this.save();return locked[0]}}
    this.save();return null},
  addStars(c){this.getState().totalStars+=c;this.save()},

  // COUNTING: starts from 3-7 (below 10!)
  generateCounting(){const lv=this.getLevel('counting');let mn,mx;
    switch(lv){
      case 1:mn=3;mx=7;break;     // below 10
      case 2:mn=5;mx=10;break;    // around 10
      case 3:mn=8;mx=15;break;    // teens
      case 4:mn=11;mx=20;break;   // teens-20s
      case 5:mn=15;mx=30;break;   // bigger
      default:mn=3;mx=7}
    const ans=mn+Math.floor(Math.random()*(mx-mn+1));
    return {answer:ans,distractors:this._dist(ans,mn,mx),level:lv}},

  // ADDITION: starts from small sums below 10
  generateAddition(){const lv=this.getLevel('addition');let a,b;
    switch(lv){
      case 1: // sum ≤ 8
        b=1+Math.floor(Math.random()*2); // 1 or 2
        a=2+Math.floor(Math.random()*(8-b-2+1));break;
      case 2: // sum ≤ 12
        b=1+Math.floor(Math.random()*4);
        a=2+Math.floor(Math.random()*(12-b-2+1));break;
      case 3: // sum ≤ 18
        b=2+Math.floor(Math.random()*5);
        a=3+Math.floor(Math.random()*(18-b-3+1));break;
      case 4: // sum ≤ 25
        b=2+Math.floor(Math.random()*8);
        a=5+Math.floor(Math.random()*(25-b-5+1));break;
      case 5: // sum ≤ 50
        b=3+Math.floor(Math.random()*10);
        a=8+Math.floor(Math.random()*(50-b-8+1));break;
      default:a=3;b=2}
    const ans=a+b;return {a,b,answer:ans,distractors:this._dist(ans,Math.max(ans-4,1),ans+4),operation:'+',level:lv}},

  // SUBTRACTION: starts from small numbers below 10
  generateSubtraction(){const lv=this.getLevel('subtraction');let a,b;
    switch(lv){
      case 1: // minuend ≤ 8, -1 or -2
        b=1+Math.floor(Math.random()*2);
        a=4+Math.floor(Math.random()*5);break; // 4-8
      case 2: // minuend ≤ 12
        b=1+Math.floor(Math.random()*3);
        a=5+Math.floor(Math.random()*8);break;
      case 3: // minuend ≤ 18
        b=2+Math.floor(Math.random()*4);
        a=8+Math.floor(Math.random()*11);break;
      case 4: // minuend ≤ 25
        b=2+Math.floor(Math.random()*7);
        a=10+Math.floor(Math.random()*16);break;
      case 5: // minuend ≤ 50
        b=3+Math.floor(Math.random()*12);
        a=18+Math.floor(Math.random()*33);break;
      default:a=7;b=2}
    if(a-b<1) a=b+1+Math.floor(Math.random()*3);
    const ans=a-b;return {a,b,answer:ans,distractors:this._dist(ans,Math.max(ans-4,0),ans+4),operation:'-',level:lv}},

  // COMPARISON: starts from small numbers below 10
  generateComparison(){const lv=this.getLevel('comparison');let minGap,maxNum,minNum;
    switch(lv){
      case 1:minNum=1;maxNum=9;minGap=3;break;    // both under 10, easy
      case 2:minNum=2;maxNum=10;minGap=2;break;   // around 10, can cross
      case 3:minNum=3;maxNum=15;minGap=2;break;   // mix under/over 10
      case 4:minNum=5;maxNum=25;minGap=1;break;   // bigger numbers
      case 5:minNum=10;maxNum=50;minGap=1;break;  // large range
      default:minNum=1;maxNum=9;minGap=3}
    const gap=minGap+Math.floor(Math.random()*3);
    let numA=minNum+Math.floor(Math.random()*(maxNum-gap-minNum+1));
    let numB=numA+gap;
    if(Math.random()<0.5)[numA,numB]=[numB,numA];
    return {numA,numB,answer:Math.max(numA,numB),level:lv}},

  // PUZZLE: gradual difficulty - first 3 counting, then mix, then harder
  generatePuzzleQuestion(pieceIndex){
    const idx=pieceIndex||0;
    if(idx<3) return {...this.generateCounting(),mode:'counting'};
    if(idx<6){
      if(Math.random()<0.5) return {...this.generateCounting(),mode:'counting'};
      return {...this.generateAddition(),mode:'addition'};
    }
    const r=Math.random();
    if(r<0.3) return {...this.generateCounting(),mode:'counting'};
    if(r<0.7) return {...this.generateAddition(),mode:'addition'};
    const sl=this.getLevel('subtraction');
    if(sl>=2) return {...this.generateSubtraction(),mode:'addition'};
    return {...this.generateAddition(),mode:'addition'};
  },

  // MEMORY: generates equation+answer pairs
  generateMemoryPairs(count){
    const pairs=[];const used=new Set();
    for(let i=0;i<count;i++){
      let q,eq,ans;let att=0;
      do{
        att++;
        if(Math.random()<0.6){q=this.generateAddition();eq=`${q.a} + ${q.b}`;ans=q.answer}
        else{q=this.generateSubtraction();eq=`${q.a} - ${q.b}`;ans=q.answer}
      }while(used.has(ans)&&att<20);
      used.add(ans);
      pairs.push({equation:eq,answer:ans,hebrewEq:`${HEBREW_NUMBERS[q.a]||q.a} ${q.operation==='+'?'ועוד':'פחות'} ${HEBREW_NUMBERS[q.b]||q.b}`,
        hebrewAns:HEBREW_NUMBERS[ans]||String(ans)});
    }
    return pairs;
  },

  // ORDINALITY: generate lineup question
  generateOrdinalQuestion(){
    const lv=this.getLevel('ordinality');let lineupSize,askType;
    switch(lv){
      case 1:lineupSize=3+Math.floor(Math.random()*3);askType=Math.random()<0.7?'cardinality':'ordinal';break;
      case 2:lineupSize=4+Math.floor(Math.random()*3);askType=Math.random()<0.4?'cardinality':'ordinal';break;
      case 3:lineupSize=5+Math.floor(Math.random()*3);askType=Math.random()<0.3?'cardinality':'ordinal';break;
      case 4:lineupSize=6+Math.floor(Math.random()*3);askType=Math.random()<0.5?'ordinal':'reverse';break;
      case 5:lineupSize=7+Math.floor(Math.random()*3);askType=Math.random()<0.3?'cardinality':Math.random()<0.6?'ordinal':'reverse';break;
      default:lineupSize=4;askType='cardinality'}
    return {lineupSize,askType,level:lv};
  },

  _dist(ans,mn,mx){const opts=new Set([ans]);let att=0;
    while(opts.size<3&&att<50){att++;let d;
      if(Math.random()<0.5) d=ans+(1+Math.floor(Math.random()*3))*(Math.random()<0.5?1:-1);
      else d=mn+Math.floor(Math.random()*(mx-mn+1));
      if(d>=1&&d!==ans) opts.add(d)}
    while(opts.size<3) opts.add(ans+opts.size);
    return Array.from(opts).sort(()=>Math.random()-0.5)}
};

// ===== PARTICLE SYSTEM =====
const Particles = {
  canvas:null,ctx:null,particles:[],animId:null,
  init(){this.canvas=document.getElementById('particles-canvas');
    this.ctx=this.canvas.getContext('2d');this._resize();
    window.addEventListener('resize',()=>this._resize())},
  _resize(){this.canvas.width=window.innerWidth;this.canvas.height=window.innerHeight},
  spawn(x,y,color,count){for(let i=0;i<count;i++){
    const angle=Math.random()*Math.PI*2;const speed=2+Math.random()*6;
    const size=3+Math.random()*5;
    this.particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
      size,color:color||this._randColor(),life:1,decay:0.015+Math.random()*0.02,
      type:'circle'})}
    if(!this.animId) this._animate()},
  spawnStars(x,y,color,count){for(let i=0;i<count;i++){
    const angle=Math.random()*Math.PI*2;const speed=3+Math.random()*5;
    this.particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
      size:6+Math.random()*8,color:color||'#FFD700',life:1,decay:0.012+Math.random()*0.015,
      type:'star'})}
    if(!this.animId) this._animate()},
  spawnConfetti(count){for(let i=0;i<count;i++){
    const x=Math.random()*this.canvas.width;const y=-20-Math.random()*100;
    this.particles.push({x,y,vx:(Math.random()-0.5)*3,vy:1+Math.random()*3,
      size:6+Math.random()*6,color:this._randColor(),life:1,decay:0.003+Math.random()*0.005,
      type:'confetti',rot:Math.random()*360,rotSpeed:(Math.random()-0.5)*10})}
    if(!this.animId) this._animate()},
  _randColor(){const colors=['#FF6347','#FFD700','#00BFFF','#FF1493','#7FFF00','#FF4500','#9400D3','#00FF7F'];
    return colors[Math.floor(Math.random()*colors.length)]},
  _animate(){this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
    this.particles=this.particles.filter(p=>{
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life-=p.decay;
      if(p.life<=0) return false;
      this.ctx.save();this.ctx.globalAlpha=p.life;
      if(p.type==='star'){this._drawStar(p.x,p.y,p.size,p.color)}
      else if(p.type==='confetti'){this.ctx.translate(p.x,p.y);
        p.rot+=p.rotSpeed;this.ctx.rotate(p.rot*Math.PI/180);
        this.ctx.fillStyle=p.color;this.ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);
        this.ctx.setTransform(1,0,0,1,0,0)}
      else{this.ctx.fillStyle=p.color;this.ctx.beginPath();
        this.ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);this.ctx.fill()}
      this.ctx.restore();return true});
    if(this.particles.length>0) this.animId=requestAnimationFrame(()=>this._animate());
    else{this.animId=null;this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height)}},
  _drawStar(cx,cy,size,color){this.ctx.fillStyle=color;this.ctx.beginPath();
    for(let i=0;i<5;i++){const angle=i*Math.PI*2/5-Math.PI/2;
      const ox=cx+Math.cos(angle)*size;const oy=cy+Math.sin(angle)*size;
      if(i===0) this.ctx.moveTo(ox,oy);else this.ctx.lineTo(ox,oy);
      const ia=angle+Math.PI/5;this.ctx.lineTo(cx+Math.cos(ia)*size*0.4,cy+Math.sin(ia)*size*0.4)}
    this.ctx.closePath();this.ctx.fill()}
};

// ===== MAIN GAME =====
const Game = {
  currentMode:null,currentHero:null,state:null,timeouts:[],QUESTIONS:8,roundStreak:0,
  _initialized:false,

  init(){
    if(this._initialized) return;
    this._initialized=true;
    document.getElementById('btn-counting').addEventListener('click',()=>this.startMode('counting'));
    document.getElementById('btn-mission').addEventListener('click',()=>this.startMode('mission'));
    document.getElementById('btn-battle').addEventListener('click',()=>this.startMode('battle'));
    document.getElementById('btn-puzzle').addEventListener('click',()=>this.startMode('puzzle'));
    document.getElementById('btn-memory').addEventListener('click',()=>this.startMode('memory'));
    document.getElementById('btn-order').addEventListener('click',()=>this.startMode('order'));
    document.getElementById('back-btn').addEventListener('click',()=>this.showMenu());
    document.getElementById('btn-retry').addEventListener('click',()=>this.startMode(this.currentMode));
    document.getElementById('btn-results-menu').addEventListener('click',()=>this.showMenu());
    Particles.init();
    this.showMenu();
  },

  cleanup(){this.timeouts.forEach(t=>clearTimeout(t));this.timeouts=[];Speech.stop()},
  _t(fn,ms){const t=setTimeout(fn,ms);this.timeouts.push(t);return t},

  // ===== MENU =====
  showMenu(){
    this.cleanup();
    this._showScreen('menu-screen');
    this._updateMenuStats();
    this._buildTeams();
    Decorations.addToScreen(document.getElementById('menu-screen'),5);
    Decorations.addModeWatermarks();
