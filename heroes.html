  },

  _showScreen(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.getElementById('results-overlay').style.display='none';
  },

  _updateMenuStats(){
    const st=Adaptive.getState();
    const starEl=document.getElementById('star-counter');
    starEl.textContent='⭐ '+st.totalStars;
    starEl.dataset.speak=st.totalStars+' כוכבים';
    const row=document.getElementById('collection-row');
    row.innerHTML=HEROES_DATA.map(h=>{
      const unlocked=st.heroesUnlocked.includes(h.id);
      return `<span class="collection-badge ${unlocked?'unlocked':'locked'}" data-speak="${unlocked?h.name_he:'נעול'}"
        style="${unlocked?'background:'+h.color+';border-color:'+h.color:'background:#222;border-color:#444'}">
        <img src="${h.image}" alt="${h.name_he}" onerror="this.parentElement.textContent='${unlocked?h.emoji:'🔒'}'">
      </span>`}).join('');
  },

  _buildTeams(){
    const st=Adaptive.getState();
    const grid=document.getElementById('teams-grid');
    grid.innerHTML=TEAMS_DATA.map((team,idx)=>{
      const membersHtml=team.members.map(mid=>{
        const hero=HEROES_DATA.find(h=>h.id===mid);
        if(!hero) return '';
        const isUnlocked=st.heroesUnlocked.includes(mid);
        return `<img class="team-member ${isUnlocked?'':'locked-member'}" src="${hero.image}" alt="${hero.name_he}"
          onerror="this.style.display='none'" title="${hero.name_he}">`;
      }).join('');
      const fullWidth=team.members.length>5?'full-width':'';
      const allUnlocked=team.members.every(mid=>st.heroesUnlocked.includes(mid));
      const teamComplete=allUnlocked?'team-complete':'';
      return `<div class="team-card ${team.cssClass} ${fullWidth} ${teamComplete}" data-speak="${team.name_he}">
        <div class="speed-lines"></div>
        <div class="comic-corner"></div>
        <div class="team-card-header">${team.logo}<span class="team-card-name">${team.name_he}</span>${allUnlocked?'<span style="font-size:0.8rem;margin-right:4px">✓</span>':''}</div>
        <div class="team-members">${membersHtml}</div>
      </div>`;
    }).join('');
  },

  _pickHero(){
    const st=Adaptive.getState();
    const unlocked=HEROES_DATA.filter(h=>st.heroesUnlocked.includes(h.id));
    return unlocked[Math.floor(Math.random()*unlocked.length)]},

  // ===== COUNTDOWN =====
  _doCountdown(cb){
    const overlay=document.getElementById('countdown-overlay');
    const numEl=document.getElementById('countdown-number');
    overlay.style.display='flex';
    const steps=['3','2','1','!קדימה'];
    const heSteps=['שלוש','שתיים','אחת','קדימה'];
    const colors=['#FF6347','#FFD700','#00BFFF','#7FFF00'];
    let i=0;
    const next=()=>{
      if(i>=steps.length){overlay.style.display='none';cb();return}
      numEl.textContent=steps[i];numEl.style.color=colors[i];
      numEl.style.animation='none';numEl.offsetHeight;numEl.style.animation='countZoom 0.7s ease';
      if(i<3) Sounds.countdown(); else Sounds.countdownGo();
      Speech.speak(heSteps[i]);
      i++;this._t(next,800)};
    next();
  },

  // ===== START MODE =====
  startMode(mode){
    this.cleanup();this.currentMode=mode;this.currentHero=this._pickHero();this.roundStreak=0;
    this.state={questionIndex:0,score:0,questions:[],answered:false};
    const modeNames={counting:'ספירת כוח',mission:'משימת גיבורים',battle:'קרב מספרים',
      puzzle:'פאזל חשבון',memory:'זיכרון חשבון',order:'מספרים בסדר'};
    Speech.speak(modeNames[mode]);
    Sounds.whoosh();

    if(mode==='memory'){
      // Memory mode has its own flow
      this._showScreen('game-screen');
      const gs=document.getElementById('game-screen');
      gs.style.background=this.currentHero.gradient;
      Decorations.addToScreen(gs,3);
      this._t(()=>{this._doCountdown(()=>{
        this._t(()=>Speech.speak(this.currentHero.phrases.intro),200);
        this._t(()=>this._startMemory(),800);
      })},300);
      return;
    }

    const numQ=mode==='puzzle'?9:this.QUESTIONS;
    this.state.questions=[];
    for(let i=0;i<numQ;i++){
      if(mode==='counting') this.state.questions.push(Adaptive.generateCounting());
      else if(mode==='mission'){
        const sl=Adaptive.getLevel('subtraction');
        if(sl>=2&&Math.random()<0.4) this.state.questions.push(Adaptive.generateSubtraction());
        else this.state.questions.push(Adaptive.generateAddition());
      } else if(mode==='battle') this.state.questions.push(Adaptive.generateComparison());
      else if(mode==='puzzle') this.state.questions.push(Adaptive.generatePuzzleQuestion(i));
      else if(mode==='order') this.state.questions.push(Adaptive.generateOrdinalQuestion());
    }

    this._showScreen('game-screen');
    const gs=document.getElementById('game-screen');
    gs.style.background=this.currentHero.gradient;
    Decorations.addToScreen(gs,3);

    this._t(()=>{
      this._doCountdown(()=>{
        this._t(()=>Speech.speak(this.currentHero.phrases.intro),200);
        this._t(()=>this._showQuestion(),800);
      });
    },300);
  },

  // ===== SHOW QUESTION =====
  _showQuestion(){
    const {questionIndex,questions}=this.state;
    if(questionIndex>=questions.length){
      if(this.currentMode==='puzzle') this.state.score=this.state.puzzleRevealed?this.state.puzzleRevealed.length:0;
      this._showResults();return}
    this.state.answered=false;
    const q=questions[questionIndex];
    document.getElementById('progress-text').textContent=`${questionIndex+1}/${questions.length}`;
    this._updatePowerMeter();
    // Show round banner on first question
    if(questionIndex===0){
      const gs=document.getElementById('game-screen');
      Decorations.showRoundBanner(gs,questionIndex+1);
    }
    const heroArea=document.getElementById('hero-area');
    heroArea.innerHTML=`<img src="${this.currentHero.image}" alt="${this.currentHero.name_he}" data-speak="${this.currentHero.name_he}"
      onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<span style=\\'font-size:7rem\\' data-speak=\\'${this.currentHero.name_he}\\'>${this.currentHero.emoji}</span>')">`;
    heroArea.className='hero-area';
    document.getElementById('progress-text').dataset.speak=`שאלה ${questionIndex+1} מתוך ${questions.length}`;
    const qArea=document.getElementById('question-area');
    const aArea=document.getElementById('answers-area');
    if(this.currentMode==='counting') this._showCounting(q,qArea,aArea);
    else if(this.currentMode==='mission') this._showMission(q,qArea,aArea);
    else if(this.currentMode==='battle') this._showBattle(q,qArea,aArea);
    else if(this.currentMode==='puzzle') this._showPuzzleQuestion(q,qArea,aArea);
    else if(this.currentMode==='order') this._showOrderQuestion(q,qArea,aArea);
  },

  // ===== COUNTING MODE =====
  _showCounting(q,qArea,aArea){
    const hero=this.currentHero;const count=q.answer;
    let items='<div class="count-items">';
    for(let i=0;i<count;i++) items+=`<span class="count-item" style="animation-delay:${i*0.1}s">${hero.powerEmoji}</span>`;
    items+='</div>';
    qArea.innerHTML=`<div class="speech-bubble"><div class="prompt-text" data-speak="כמה ${hero.powerName_he} יש">?כמה ${hero.powerName_he} יש</div>${items}</div>`;
    this._t(()=>Speech.speak(`כמה ${hero.powerName_he} יש? ספור אותם`),300);
    this._showAnswerBtns(q.distractors,q.answer,aArea,'counting');
  },

  // ===== MISSION MODE =====
  _showMission(q,qArea,aArea){
    const hero=this.currentHero;const isAdd=q.operation==='+';
    const opSym=isAdd?'+':'−';const opWord=isAdd?'ועוד':'פחות';
    const opClass=isAdd?'add':'sub';
    qArea.innerHTML=`
      <div class="speech-bubble">
        <div class="prompt-text">${hero.name_he}</div>
        <div class="equation">
          <span class="eq-num">${q.a}</span>
          <span class="eq-op ${opClass}">${opSym}</span>
          <span class="eq-num">${q.b}</span>
          <span class="eq-op eq">=</span>
          <span class="eq-num eq-mystery">?</span>
        </div>
      </div>
      <div class="eq-items">
        ${this._renderItemGroup(q.a,hero.powerEmoji)}
        <span class="eq-op-big ${opClass}">${opSym}</span>
        ${this._renderItemGroup(q.b,hero.powerEmoji)}
      </div>`;
    const nA=HEBREW_NUMBERS[q.a]||q.a;const nB=HEBREW_NUMBERS[q.b]||q.b;
    this._t(()=>Speech.speak(`${nA} ${opWord} ${nB} שווה?`),300);
    this._showAnswerBtns(q.distractors,q.answer,aArea,q.operation==='+'?'addition':'subtraction');
  },

  _renderItemGroup(count,emoji){
    if(count>15) return `<span class="item-group"><span class="big-num">${count}</span><span>${emoji}</span></span>`;
    let h='<span class="item-group">';
    for(let i=0;i<count;i++) h+=`<span class="small-item">${emoji}</span>`;
    return h+'</span>';
  },

  // ===== BATTLE MODE =====
  _showBattle(q,qArea,aArea){
    const st=Adaptive.getState();
    const unlocked=HEROES_DATA.filter(h=>st.heroesUnlocked.includes(h.id));
    let heroA=unlocked[Math.floor(Math.random()*unlocked.length)];
    let heroB=unlocked[Math.floor(Math.random()*unlocked.length)];
    if(unlocked.length>1) while(heroB.id===heroA.id) heroB=unlocked[Math.floor(Math.random()*unlocked.length)];
    qArea.innerHTML=`
      <div class="speech-bubble" style="background:url('images/comics/burst-purple.png') center/contain no-repeat,rgba(255,255,255,0.12);padding:20px 28px"><div class="prompt-text">?מי חזק יותר</div></div>
      <div class="battle-area">
        <button class="battle-card" data-num="${q.numA}" data-speak="${heroA.name_he}, ${HEBREW_NUMBERS[q.numA]||q.numA}" style="border-color:${heroA.color}">
          <img src="${heroA.image}" alt="${heroA.name_he}" onerror="this.outerHTML='<span style=\\'font-size:4rem\\'>${heroA.emoji}</span>'">
          <span class="battle-num" style="color:${heroA.color}">${q.numA}</span>
          <span class="battle-name">${heroA.name_he}</span>
        </button>
        <span style="position:relative;display:flex;align-items:center;justify-content:center">
          <img class="vs-splat" src="images/heroes/pngwing.com (14).png" alt="" onerror="this.remove()">
          <span class="vs-text" data-speak="מול">⚡VS⚡</span>
        </span>
        <button class="battle-card" data-num="${q.numB}" data-speak="${heroB.name_he}, ${HEBREW_NUMBERS[q.numB]||q.numB}" style="border-color:${heroB.color}">
          <img src="${heroB.image}" alt="${heroB.name_he}" onerror="this.outerHTML='<span style=\\'font-size:4rem\\'>${heroB.emoji}</span>'">
          <span class="battle-num" style="color:${heroB.color}">${q.numB}</span>
          <span class="battle-name">${heroB.name_he}</span>
        </button>
      </div>`;
    aArea.innerHTML='';
    const nA=HEBREW_NUMBERS[q.numA]||q.numA;const nB=HEBREW_NUMBERS[q.numB]||q.numB;
    this._t(()=>Speech.speak(`${nA} או ${nB}? מי חזק יותר? מי יש לו יותר?`),300);
    const cards=qArea.querySelectorAll('.battle-card');
    cards.forEach(card=>{card.addEventListener('click',()=>{
      if(this.state.answered) return;
      this._handleBattle(parseInt(card.dataset.num),q.answer,cards)})});
  },

  _handleBattle(chosen,correct,cards){
    this.state.answered=true;
    cards.forEach(card=>{const num=parseInt(card.dataset.num);
      if(num===correct) card.classList.add('winner');else card.classList.add('loser')});
    if(chosen===correct){
      this.state.score++;this.roundStreak++;
      const result=Adaptive.recordCorrect('comparison');
      Sounds.powerUp();this._correctEffects(result==='level_up');
      this._t(()=>{const nh=HEBREW_NUMBERS[correct]||correct;Speech.speak(`${nh} יותר גדול!`)},1200);
    } else {
      this.roundStreak=0;Adaptive.recordWrong('comparison');Sounds.wrong();this._wrongEffects();
      this._t(()=>{const nh=HEBREW_NUMBERS[correct]||correct;Speech.speak(`${nh} יותר גדול`)},1200);
    }
    this._updatePowerMeter();
    this._t(()=>this._nextQuestion(),2500);
  },

  // ===== ANSWER BUTTONS =====
  _showAnswerBtns(options,answer,container,skill){
    container.innerHTML=options.map(num=>{const hn=HEBREW_NUMBERS[num]||num;return `<button class="answer-btn" data-num="${num}" data-speak="${hn}">${num}</button>`}).join('');
    container.querySelectorAll('.answer-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{
        if(this.state.answered) return;
        this._handleAnswer(parseInt(btn.dataset.num),answer,container,skill)})});
  },

  _handleAnswer(chosen,correct,container,skill){
    this.state.answered=true;
    const btns=container.querySelectorAll('.answer-btn');
    btns.forEach(btn=>{const num=parseInt(btn.dataset.num);btn.classList.add('disabled');
      if(num===correct) btn.classList.add('correct');
      else if(num===chosen&&num!==correct) btn.classList.add('wrong')});
    if(chosen===correct){
      this.state.score++;this.roundStreak++;
      const result=Adaptive.recordCorrect(skill);
      Sounds.powerUp();this._correctEffects(result==='level_up');
      // Puzzle mode: reveal piece
      if(this.currentMode==='puzzle'&&this.state.puzzleRevealed){
        const pieceIdx=this.state.questionIndex;
        this.state.puzzleRevealed.push(pieceIdx);
        const piece=document.querySelector(`.puzzle-piece[data-idx="${pieceIdx}"]`);
        if(piece){piece.classList.add('revealed');piece.classList.remove('active');
          const num=piece.querySelector('.puzzle-num');if(num) num.style.display='none'}
      }
      this._t(()=>{const nh=HEBREW_NUMBERS[correct]||correct;Speech.speak(`${nh}!`)},1000);
    } else {
      this.roundStreak=0;Adaptive.recordWrong(skill);Sounds.wrong();this._wrongEffects();
      this._t(()=>{const nh=HEBREW_NUMBERS[correct]||correct;Speech.speak(`התשובה היא ${nh}`)},1200);
    }
    this._updatePowerMeter();
    this._t(()=>this._nextQuestion(),2800);
  },

  // ===== EFFECTS =====
  _correctEffects(isLevelUp){
    const heroArea=document.getElementById('hero-area');
    heroArea.classList.add('celebrate');
    const flash=document.getElementById('screen-flash');
    flash.style.background='rgba(255,215,0,0.3)';flash.style.opacity='1';
    setTimeout(()=>{flash.style.opacity='0'},150);
    const rect=heroArea.getBoundingClientRect();
    const cx=rect.left+rect.width/2;const cy=rect.top+rect.height/2;
    Particles.spawnStars(cx,cy,this.currentHero.color,15);
    Particles.spawn(cx,cy,this.currentHero.color,10);
    this._showActionWord();
    this._checkStreak();
    this._speakPraise(isLevelUp);
  },

  _wrongEffects(){
    const heroArea=document.getElementById('hero-area');
    heroArea.classList.add('sad');
    const flash=document.getElementById('screen-flash');
    flash.style.background='rgba(255,100,0,0.15)';flash.style.opacity='1';
    setTimeout(()=>{flash.style.opacity='0'},200);
    this._speakEncourage();
  },

  _showActionWord(){
    const el=document.getElementById('action-word');
    const word=ACTION_WORDS[Math.floor(Math.random()*ACTION_WORDS.length)];
    const imgSrc=ACTION_IMAGES[word];
    if(imgSrc){
      el.className='';el.innerHTML=`<img src="${imgSrc}" alt="${word}">`;
    } else {
      el.className='text-mode';el.innerHTML=word;
    }
    el.style.top=(20+Math.random()*30)+'%';
    el.style.left=(15+Math.random()*50)+'%';
    el.style.display='block';el.style.animation='none';
    el.offsetHeight;el.style.animation='actionPop 0.8s ease forwards';
    setTimeout(()=>{el.style.display='none'},900);
  },

  _checkStreak(){
    const banner=document.getElementById('streak-banner');
    let text=null;
    if(this.roundStreak===3){text='🔥 !שלוש ברצף';Sounds.combo()}
    else if(this.roundStreak===5){text='🔥🔥 !חמש ברצף! מדהים';Sounds.combo();
      Particles.spawnConfetti(30)}
    else if(this.roundStreak===8){text='🏆 !מושלם! שמונה ברצף';Sounds.celebration();
      Particles.spawnConfetti(60)}
    if(text){
      banner.textContent=text;banner.style.display='block';
      banner.style.animation='none';banner.offsetHeight;
      banner.style.animation='streakPop 1.2s ease forwards';
      this._t(()=>{banner.style.display='none'},1300);
      this._t(()=>Speech.speak(text.replace(/[🔥🏆]/g,'').replace('!','')),200);
    }
  },

  _nextQuestion(){
    this.state.questionIndex++;
    const total=this.state.questions.length;
    const remaining=total-this.state.questionIndex;
    for(let i=0;i<remaining;i++){
      const idx=this.state.questionIndex+i;
      if(this.currentMode==='counting') this.state.questions[idx]=Adaptive.generateCounting();
      else if(this.currentMode==='mission'){
        const sl=Adaptive.getLevel('subtraction');
        if(sl>=2&&Math.random()<0.4) this.state.questions[idx]=Adaptive.generateSubtraction();
        else this.state.questions[idx]=Adaptive.generateAddition();
      } else if(this.currentMode==='battle') this.state.questions[idx]=Adaptive.generateComparison();
      else if(this.currentMode==='puzzle') this.state.questions[idx]=Adaptive.generatePuzzleQuestion(idx);
      else if(this.currentMode==='order') this.state.questions[idx]=Adaptive.generateOrdinalQuestion();
    }
    this._showQuestion();
  },

  // ===== POWER METER =====
  _updatePowerMeter(){
    const meter=document.getElementById('power-meter');if(!meter) return;
    const hero=this.currentHero;const {score}=this.state;
    let h='';for(let i=0;i<this.QUESTIONS;i++){
      const filled=i<score;
      h+=`<span class="power-orb ${filled?'filled':''}"
        style="${filled?'background:'+hero.color+';border-color:'+hero.color:''}">
        ${filled?hero.powerEmoji:'○'}</span>`}
    meter.innerHTML=h;
  },

  // ===== RESULTS =====
  _showResults(){
    this.cleanup();
    let total,score;
    if(this.currentMode==='memory'){
      total=6;score=this.state.score;
      // Star rating based on attempts
      const att=this.state.memoryAttempts||0;
      if(att<=9) score=6; else if(att<=12) score=5; else if(att<=15) score=4;
      else if(att<=18) score=3; else score=2;
      this.state.score=score;
    } else {
      score=this.state.score;total=this.state.questions.length;
    }
    const hero=this.currentHero;
    Adaptive.addStars(score);
    const newHeroId=Adaptive.unlockNextHero();
    const newHero=newHeroId?HEROES_DATA.find(h=>h.id===newHeroId):null;

    const resultsEl=document.getElementById('results-overlay');
    resultsEl.style.display='flex';
    // Add sparkle overlay and floating decorations
    resultsEl.querySelectorAll('.results-sparkle,.deco-float').forEach(d=>d.remove());
    const sparkle=document.createElement('img');
    sparkle.className='results-sparkle';sparkle.src='images/heroes/pngwing.com (3).png';
    sparkle.alt='';sparkle.onerror=()=>sparkle.remove();
    resultsEl.insertBefore(sparkle,resultsEl.firstChild);
    Decorations.addToScreen(resultsEl,4);

    const pct=Math.round((score/total)*100);
    let title,emoji;
    if(pct>=90){title='!גיבור על אמיתי';emoji='🏆'}
    else if(pct>=70){title='!כל הכבוד';emoji='🌟'}
    else if(pct>=50){title='!יפה מאוד';emoji='👏'}
    else{title='!ניסיון טוב';emoji='💪'}

    document.getElementById('results-hero').innerHTML=
      `<img src="${hero.image}" alt="${hero.name_he}"
        onerror="this.outerHTML='<span style=\\'font-size:6rem\\'>${hero.emoji}</span>'">`;
    document.getElementById('results-title').textContent=emoji+' '+title;

    let starsHtml='';
    for(let i=0;i<total;i++){
      const earned=i<score;
      starsHtml+=`<span class="star ${earned?'':'empty'}" style="animation-delay:${i*0.15}s">⭐</span>`;
    }
    document.getElementById('results-stars').innerHTML=starsHtml;
    document.getElementById('results-score').textContent=`${score} מתוך ${total}`;

    const unlockEl=document.getElementById('results-unlock');
    if(newHero){
      unlockEl.innerHTML=`<div class="unlock-box">
        <div class="unlock-title">!גיבור חדש נפתח</div>
        <img src="${newHero.image}" alt="${newHero.name_he}"
          onerror="this.outerHTML='<span style=\\'font-size:5rem\\'>${newHero.emoji}</span>'">
        <div class="unlock-name">${newHero.name_he}</div></div>`;
    } else unlockEl.innerHTML='';

    if(pct>=70){Sounds.celebration();Particles.spawnConfetti(80)}
    else Sounds.correct();

    this._t(()=>{
      const scoreText=`${score} מתוך ${total}`;
      if(newHero) Speech.speakSequence([title.replace('!',''),scoreText,`גיבור חדש נפתח! ${newHero.name_he}`],1000);
      else Speech.speakSequence([title.replace('!',''),scoreText],1000);
    },500);
  },

  // ===== PUZZLE MODE =====
  _showPuzzleQuestion(q,qArea,aArea){
    const hero=this.currentHero;
    // Initialize puzzle state on first question
    if(!this.state.puzzleRevealed) this.state.puzzleRevealed=[];
    const pieceIdx=this.state.questionIndex;
    // Show the puzzle grid
    let gridHtml='<div class="puzzle-grid" style="position:relative">';
    for(let i=0;i<9;i++){
      const isRevealed=this.state.puzzleRevealed.includes(i);
      const row=Math.floor(i/3);const col=i%3;
      // Each piece shows its portion of the hero image
      // Use 260% zoom (slightly less than 300%) so the face fills more of the grid
      // and hero color as fallback for transparent edges
      const bpX=col===0?'0%':col===1?'50%':'100%';
      const bpY=row===0?'10%':row===1?'50%':'90%';
      gridHtml+=`<div class="puzzle-piece ${isRevealed?'revealed':''} ${i===pieceIdx?'active':''}" data-idx="${i}"
        style="${isRevealed?'background:'+hero.color:''}">
        <div class="puzzle-img" style="background:${hero.color} url('${hero.image}') no-repeat;background-size:260% auto;background-position:${bpX} ${bpY}"></div>
        ${isRevealed?'':`<span class="puzzle-num">${i+1}</span>`}
      </div>`;
    }
    gridHtml+='</div>';
    // Show question based on type
    if(q.mode==='counting'){
      let items='';
      for(let i=0;i<q.answer;i++) items+=`<span class="count-item" style="animation-delay:${i*0.08}s">${hero.powerEmoji}</span>`;
      qArea.innerHTML=`${gridHtml}<div class="speech-bubble" style="margin-top:8px">
        <div class="prompt-text" data-speak="כמה ${hero.powerName_he} יש">?כמה ${hero.powerName_he} יש</div>
        <div class="count-items">${items}</div></div>`;
      this._t(()=>Speech.speak(`כמה ${hero.powerName_he} יש?`),300);
      this._showAnswerBtns(q.distractors,q.answer,aArea,'counting');
    } else {
      const isAdd=q.operation==='+';const opSym=isAdd?'+':'−';const opClass=isAdd?'add':'sub';
      const opWord=isAdd?'ועוד':'פחות';
      qArea.innerHTML=`${gridHtml}<div class="speech-bubble" style="margin-top:8px">
        <div class="equation">
          <span class="eq-num">${q.a}</span><span class="eq-op ${opClass}">${opSym}</span>
          <span class="eq-num">${q.b}</span><span class="eq-op eq">=</span>
          <span class="eq-num eq-mystery">?</span></div></div>`;
      const nA=HEBREW_NUMBERS[q.a]||q.a;const nB=HEBREW_NUMBERS[q.b]||q.b;
      this._t(()=>Speech.speak(`${nA} ${opWord} ${nB} שווה?`),300);
      this._showAnswerBtns(q.distractors,q.answer,aArea,q.operation==='+'?'addition':'subtraction');
    }
  },

  // Override _handleAnswer for puzzle mode to reveal pieces
  _handleAnswerOriginal:null,

  // ===== MEMORY CARD GAME =====
  _startMemory(){
    const hero=this.currentHero;
    const pairs=Adaptive.generateMemoryPairs(6);
    const cards=[];
    pairs.forEach((p,i)=>{
      cards.push({id:i,type:'equation',text:p.equation,pairId:i,speak:p.hebrewEq});
      cards.push({id:i,type:'answer',text:String(p.answer),pairId:i,speak:p.hebrewAns});
    });
    // Shuffle
    for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}
    this.state.memoryCards=cards;this.state.memoryFlipped=[];this.state.memoryMatched=[];
    this.state.memoryAttempts=0;this.state.memoryLocked=false;
    const qArea=document.getElementById('question-area');
    const aArea=document.getElementById('answers-area');
    aArea.innerHTML='';
    const heroArea=document.getElementById('hero-area');
    heroArea.innerHTML=`<img src="${hero.image}" alt="${hero.name_he}" data-speak="${hero.name_he}"
      onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<span style=\\'font-size:5rem\\'>${hero.emoji}</span>')">`;
    heroArea.className='hero-area';
    document.getElementById('progress-text').textContent='התאם תרגיל לתשובה';
    document.getElementById('progress-text').dataset.speak='התאם תרגיל לתשובה';
    let html=`<div class="memory-attempts" data-speak="ניסיונות" id="memory-attempts">ניסיונות: 0</div>
      <div class="memory-grid pairs-6">`;
    cards.forEach((c,idx)=>{
      html+=`<div class="memory-card" data-idx="${idx}" data-speak="${c.speak}">
        <div class="memory-card-inner">
          <div class="memory-card-back"></div>
          <div class="memory-card-face"><span class="card-text ${c.type==='answer'?'card-answer':''}">${c.text}</span></div>
        </div></div>`;
    });
    html+='</div>';
    qArea.innerHTML=html;
    this._t(()=>Speech.speak('התאם כל תרגיל לתשובה שלו'),300);
    qArea.querySelectorAll('.memory-card').forEach(card=>{
      card.addEventListener('click',()=>this._handleMemoryFlip(parseInt(card.dataset.idx)))});
  },

  _handleMemoryFlip(idx){
    if(this.state.memoryLocked) return;
    if(this.state.memoryFlipped.includes(idx)) return;
    if(this.state.memoryMatched.includes(this.state.memoryCards[idx].pairId)) return;
    const cards=document.querySelectorAll('.memory-card');
    cards[idx].classList.add('flipped');
    this.state.memoryFlipped.push(idx);
    const card=this.state.memoryCards[idx];
    Speech.speak(card.speak);
    if(this.state.memoryFlipped.length===2){
      this.state.memoryAttempts++;
      document.getElementById('memory-attempts').textContent='ניסיונות: '+this.state.memoryAttempts;
      const [i1,i2]=this.state.memoryFlipped;
      const c1=this.state.memoryCards[i1];const c2=this.state.memoryCards[i2];
      this.state.memoryLocked=true;
      if(c1.pairId===c2.pairId&&c1.type!==c2.type){
        // Match!
        this._t(()=>{
          cards[i1].classList.add('matched');cards[i2].classList.add('matched');
          this.state.memoryMatched.push(c1.pairId);
          this.state.score++;this.roundStreak++;
          Sounds.powerUp();
          const heroArea=document.getElementById('hero-area');heroArea.classList.add('celebrate');
          this._t(()=>heroArea.classList.remove('celebrate'),1000);
          this._showActionWord();
          this.state.memoryFlipped=[];this.state.memoryLocked=false;
          Speech.speak('מצאת התאמה!');
          if(this.state.memoryMatched.length===6) this._t(()=>this._showResults(),1200);
        },600);
      } else {
        // No match
        this._t(()=>{
          cards[i1].classList.remove('flipped');cards[i2].classList.remove('flipped');
          this.roundStreak=0;Sounds.wrong();
          this.state.memoryFlipped=[];this.state.memoryLocked=false;
          Speech.speak('נסה שוב');
        },1200);
      }
    }
  },

  // ===== ORDINALITY / CARDINALITY MODE =====
  _showOrderQuestion(q,qArea,aArea){
    // Use ALL heroes for lineup variety (not just unlocked)
    const shuffled=[...HEROES_DATA].sort(()=>Math.random()-0.5);
    const lineup=shuffled.slice(0,q.lineupSize);
    this.state.orderLineup=lineup;
    const hero=this.currentHero;

    if(q.askType==='cardinality'){
      // How many heroes?
      const count=lineup.length;
      let lineupHtml='<div class="lineup-area">';
      lineup.forEach((h,i)=>{
        lineupHtml+=`<div class="lineup-hero" data-speak="${h.name_he}" data-idx="${i}">
          <img src="${h.image}" alt="${h.name_he}" onerror="this.outerHTML='<span style=\\'font-size:2rem\\'>${h.emoji}</span>'">
          <div class="lineup-platform">${i+1}</div></div>`;
      });
      lineupHtml+='</div>';
      qArea.innerHTML=`${lineupHtml}<div class="speech-bubble"><div class="prompt-text" data-speak="כמה גיבורים עומדים בשורה">?כמה גיבורים עומדים בשורה</div></div>`;
      const distractors=Adaptive._dist(count,Math.max(count-3,1),count+3);
      this._t(()=>Speech.speak('כמה גיבורים עומדים בשורה? ספור אותם'),300);
      this._showAnswerBtns(distractors,count,aArea,'cardinality');
    } else if(q.askType==='ordinal'){
      // Who is at position X?
      const pos=1+Math.floor(Math.random()*lineup.length);
      const targetHero=lineup[pos-1];
      const ordName=HEBREW_ORDINALS[pos]||pos;
      let lineupHtml='<div class="lineup-area">';
      lineup.forEach((h,i)=>{
        lineupHtml+=`<div class="lineup-hero" data-speak="${h.name_he}, מקום ${HEBREW_ORDINALS[i+1]||i+1}" data-idx="${i}" data-hero-id="${h.id}">
          <img src="${h.image}" alt="${h.name_he}" onerror="this.outerHTML='<span style=\\'font-size:2rem\\'>${h.emoji}</span>'">
          <div class="lineup-platform">${i+1}</div></div>`;
      });
      lineupHtml+='</div>';
      qArea.innerHTML=`${lineupHtml}<div class="speech-bubble"><div class="prompt-text" data-speak="מי עומד במקום ה${ordName}">?מי עומד במקום ה${ordName}</div></div>`;
      aArea.innerHTML='';
      this._t(()=>Speech.speak(`מי עומד במקום ה${ordName}? לחץ על הגיבור הנכון`),300);
      // Click on correct hero
      qArea.querySelectorAll('.lineup-hero').forEach(el=>{
        el.style.cursor='pointer';
        el.addEventListener('click',()=>{
          if(this.state.answered) return;this.state.answered=true;
          const clickedId=el.dataset.heroId;
          if(clickedId===targetHero.id){
            el.classList.add('correct-pick');this.state.score++;this.roundStreak++;
            const result=Adaptive.recordCorrect('ordinality');
            Sounds.powerUp();this._correctEffects(result==='level_up');
            this._t(()=>Speech.speak(`${targetHero.name_he} עומד במקום ה${ordName}!`),800);
          } else {
            el.classList.add('wrong-pick');this.roundStreak=0;
            Adaptive.recordWrong('ordinality');Sounds.wrong();this._wrongEffects();
            // Highlight correct
            qArea.querySelectorAll('.lineup-hero').forEach(lh=>{
              if(lh.dataset.heroId===targetHero.id) lh.classList.add('correct-pick')});
            this._t(()=>Speech.speak(`${targetHero.name_he} עומד במקום ה${ordName}`),800);
          }
          this._updatePowerMeter();this._t(()=>this._nextQuestion(),2500);
        });
      });
    } else {
      // Reverse: what position is hero X in?
      const pos=1+Math.floor(Math.random()*lineup.length);
      const targetHero=lineup[pos-1];
      let lineupHtml='<div class="lineup-area">';
      lineup.forEach((h,i)=>{
        lineupHtml+=`<div class="lineup-hero" data-speak="${h.name_he}" data-idx="${i}">
          <img src="${h.image}" alt="${h.name_he}" onerror="this.outerHTML='<span style=\\'font-size:2rem\\'>${h.emoji}</span>'">
          <div class="lineup-platform">${i+1}</div></div>`;
      });
      lineupHtml+='</div>';
      qArea.innerHTML=`${lineupHtml}<div class="speech-bubble"><div class="prompt-text" data-speak="באיזה מקום עומד ${targetHero.name_he}">?באיזה מקום עומד ${targetHero.name_he}</div></div>`;
      // Highlight the target hero
      this._t(()=>{const heroes=qArea.querySelectorAll('.lineup-hero');
        if(heroes[pos-1]) heroes[pos-1].classList.add('highlighted')},500);
      // Generate ordinal answer buttons
      const ordOptions=[];for(let i=1;i<=lineup.length;i++) ordOptions.push(i);
      aArea.innerHTML='<div class="ordinal-buttons">'+ordOptions.map(n=>{
        const ordName=HEBREW_ORDINALS[n]||n;
        return `<button class="ordinal-btn" data-num="${n}" data-speak="מקום ${ordName}">${ordName}</button>`}).join('')+'</div>';
      this._t(()=>Speech.speak(`באיזה מקום עומד ${targetHero.name_he}?`),300);
      aArea.querySelectorAll('.ordinal-btn').forEach(btn=>{
        btn.addEventListener('click',()=>{
          if(this.state.answered) return;this.state.answered=true;
          const chosen=parseInt(btn.dataset.num);
          aArea.querySelectorAll('.ordinal-btn').forEach(b=>b.style.pointerEvents='none');
          if(chosen===pos){
            btn.classList.add('correct');this.state.score++;this.roundStreak++;
            const result=Adaptive.recordCorrect('ordinality');
            Sounds.powerUp();this._correctEffects(result==='level_up');
            const ordN=HEBREW_ORDINALS[pos]||pos;
            this._t(()=>Speech.speak(`נכון! ${targetHero.name_he} במקום ה${ordN}`),800);
          } else {
            btn.classList.add('wrong');this.roundStreak=0;
            Adaptive.recordWrong('ordinality');Sounds.wrong();this._wrongEffects();
            aArea.querySelectorAll('.ordinal-btn').forEach(b=>{if(parseInt(b.dataset.num)===pos) b.classList.add('correct')});
            const ordN=HEBREW_ORDINALS[pos]||pos;
            this._t(()=>Speech.speak(`${targetHero.name_he} במקום ה${ordN}`),800);
          }
          this._updatePowerMeter();this._t(()=>this._nextQuestion(),2500);
        });
      });
    }
  },

  // ===== SPEECH HELPERS =====
  _speakPraise(isLevelUp){
    const hero=this.currentHero;
    if(isLevelUp){
      const phrase=HERO_LEVEL_UP[Math.floor(Math.random()*HERO_LEVEL_UP.length)];
      this._t(()=>Speech.speak(phrase.replace('!','')),300);
    } else {
      const pool=[...hero.phrases.correct,...HERO_PRAISE];
      const phrase=pool[Math.floor(Math.random()*pool.length)];
      this._t(()=>Speech.speak(phrase.replace('!','')),300);
    }
  },
  _speakEncourage(){
    const hero=this.currentHero;
    const pool=[...hero.phrases.wrong,...HERO_ENCOURAGE];
    const phrase=pool[Math.floor(Math.random()*pool.length)];
    this._t(()=>Speech.speak(phrase.replace('!','')),300);
  }
};

// ===== INIT ON LOAD =====
document.addEventListener('DOMContentLoaded',()=>{
  // Start Speech init eagerly (voice loading)
  Speech.init();
  let inited=false;
  const initOnce=()=>{
    if(inited) return;inited=true;
    Sounds.init();
    document.removeEventListener('click',initOnce);
    document.removeEventListener('touchstart',initOnce);
  };
  document.addEventListener('click',initOnce);
  document.addEventListener('touchstart',initOnce);
  // Global click-to-speak for kids who can't read
  document.addEventListener('click',(e)=>{
    const el=e.target.closest('[data-speak]');
    if(el&&el.dataset.speak) Speech.speak(el.dataset.speak);
  });
  Game.init();
});

</script>
