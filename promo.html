<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>גיבורי על - MARVEL MATH</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@700;900&family=Bangers&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:1080px;height:1920px;
  background:linear-gradient(160deg,#0D0B2E 0%,#1A0A3E 30%,#2D1B69 60%,#0D0B2E 100%);
  font-family:'Heebo','Arial',sans-serif;
  overflow:hidden;
  position:relative;
}
/* Stars background */
body::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(1px 1px at 100px 200px,#fff 50%,transparent 100%),
    radial-gradient(1px 1px at 300px 400px,#FFD700 50%,transparent 100%),
    radial-gradient(2px 2px at 500px 100px,#fff 50%,transparent 100%),
    radial-gradient(1px 1px at 700px 300px,#FFD700 50%,transparent 100%),
    radial-gradient(1px 1px at 200px 600px,#fff 50%,transparent 100%),
    radial-gradient(2px 2px at 800px 500px,#fff 50%,transparent 100%),
    radial-gradient(1px 1px at 150px 800px,#FFD700 50%,transparent 100%),
    radial-gradient(1px 1px at 600px 700px,#fff 50%,transparent 100%),
    radial-gradient(1px 1px at 900px 150px,#fff 50%,transparent 100%),
    radial-gradient(2px 2px at 400px 900px,#FFD700 50%,transparent 100%);
  opacity:0.6;z-index:0;
}
/* Speed lines */
body::after{
  content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:repeating-conic-gradient(from 0deg at 50% 35%,
    transparent 0deg,rgba(255,215,0,0.03) 2deg,transparent 4deg);
  z-index:0;
}
.container{
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;
  height:100%;padding:60px 40px;
}
/* Top badge */
.badge{
  background:linear-gradient(135deg,#FFD700,#FFA000);
  color:#1A0A3E;font-size:36px;font-weight:900;
  padding:12px 40px;border-radius:50px;
  box-shadow:0 4px 20px rgba(255,215,0,0.4);
  margin-bottom:40px;letter-spacing:1px;
}
/* Marvel banner */
.marvel-logo{
  width:420px;height:110px;
  background:linear-gradient(180deg,#F44336,#B71C1C);
  border-radius:12px;border:4px solid #fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 30px rgba(244,67,54,0.5);
  margin-bottom:30px;
}
.marvel-logo span{
  font-family:'Bangers',Impact,sans-serif;
  font-size:80px;color:#fff;letter-spacing:10px;
  text-shadow:2px 2px 0 #000;
}
/* Title */
.title{
  font-size:96px;font-weight:900;
  background:linear-gradient(180deg,#FFD700 0%,#FF8F00 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:none;filter:drop-shadow(3px 3px 0 #000);
  margin-bottom:10px;letter-spacing:3px;
}
.subtitle{
  font-size:48px;color:#B0BEC5;font-weight:700;
  margin-bottom:50px;letter-spacing:2px;
}
/* Hero circles */
.heroes-row{
  display:flex;gap:20px;justify-content:center;
  margin-bottom:50px;direction:ltr;
}
.hero-circle{
  width:150px;height:150px;border-radius:50%;
  border:5px solid #FFD700;
  background:#1A237E;
  display:flex;align-items:center;justify-content:center;
  font-size:64px;
  box-shadow:0 0 20px rgba(255,215,0,0.3);
  overflow:hidden;
}
/* Game modes grid */
.modes-title{
  font-size:44px;color:#FFD700;font-weight:900;
  margin-bottom:30px;
  text-shadow:0 0 15px rgba(255,215,0,0.3);
}
.modes-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:20px;
  width:100%;max-width:900px;margin-bottom:50px;
}
.mode-card{
  background:linear-gradient(135deg,rgba(255,255,255,0.1),rgba(255,255,255,0.05));
  border:2px solid rgba(255,215,0,0.3);border-radius:20px;
  padding:22px 20px;display:flex;align-items:center;gap:16px;
  backdrop-filter:blur(5px);direction:rtl;
}
.mode-icon{font-size:42px;flex-shrink:0}
.mode-name{font-size:32px;color:#fff;font-weight:700;line-height:1.3}
/* Bottom section */
.bottom-section{
  margin-top:auto;text-align:center;width:100%;
}
.age-badge{
  display:inline-block;
  background:linear-gradient(135deg,#4CAF50,#2E7D32);
  color:#fff;font-size:38px;font-weight:900;
  padding:16px 50px;border-radius:50px;
  box-shadow:0 4px 20px rgba(76,175,80,0.4);
  margin-bottom:30px;
}
.tagline{
  font-size:42px;color:#B0BEC5;font-weight:700;
  line-height:1.6;
}
.tagline em{
  color:#FFD700;font-style:normal;
}
/* Decorative corner bursts */
.corner-tl,.corner-br{
  position:absolute;width:300px;height:300px;z-index:0;
}
.corner-tl{
  top:-50px;left:-50px;
  background:radial-gradient(circle at center,rgba(244,67,54,0.15) 0%,transparent 70%);
}
.corner-br{
  bottom:-50px;right:-50px;
  background:radial-gradient(circle at center,rgba(255,215,0,0.1) 0%,transparent 70%);
}
</style>
</head>
<body>
<div class="corner-tl"></div>
<div class="corner-br"></div>
<div class="container">

  <div class="badge">🎮 משחק חינוכי חינמי!</div>

  <div class="marvel-logo"><span>MARVEL</span></div>

  <div class="title">גיבורי על</div>
  <div class="subtitle">משחק חשבון עם גיבורי מארוול</div>

  <!-- Hero emojis as placeholders for the circles -->
  <div class="heroes-row">
    <div class="hero-circle">🕷️</div>
    <div class="hero-circle">⚡</div>
    <div class="hero-circle">🦸</div>
    <div class="hero-circle">🛡️</div>
    <div class="hero-circle">💪</div>
  </div>

  <div class="modes-title">10 משחקים מגוונים</div>
  <div class="modes-grid">
    <div class="mode-card"><span class="mode-icon">🔢</span><span class="mode-name">ספירה וזיהוי</span></div>
    <div class="mode-card"><span class="mode-icon">🗣️</span><span class="mode-name">קריאת מספרים</span></div>
    <div class="mode-card"><span class="mode-icon">📊</span><span class="mode-name">סדר מספרים</span></div>
    <div class="mode-card"><span class="mode-icon">⚔️</span><span class="mode-name">קרב מספרים</span></div>
    <div class="mode-card"><span class="mode-icon">📏</span><span class="mode-name">ציר המספרים</span></div>
    <div class="mode-card"><span class="mode-icon">🦸</span><span class="mode-name">משימת גיבור</span></div>
    <div class="mode-card"><span class="mode-icon">🧠</span><span class="mode-name">זיכרון</span></div>
    <div class="mode-card"><span class="mode-icon">🧩</span><span class="mode-name">פאזל</span></div>
    <div class="mode-card"><span class="mode-icon">💥</span><span class="mode-name">גיבורי קראש</span></div>
    <div class="mode-card"><span class="mode-icon">🏰</span><span class="mode-name">מבוך הגיבורים</span></div>
  </div>

  <div class="bottom-section">
    <div class="age-badge">גילאי 5-9</div>
    <div class="tagline">
      לומדים חשבון <em>בכיף</em> עם הגיבורים האהובים!<br>
      פותחים בטאבלט ומתחילים לשחק
    </div>
  </div>

</div>
</body>
</html>
